<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿履歴</title>
<!-- version: 1.6.0 -->
<!-- 1.6.0: 降車駅ボタン表示直後0.45秒は誤タップ防止のため押せないように変更。
           記録済みの降車駅をタップすると再度選び直せる（上書き）ように対応 -->
<!-- 1.5.0: 降車駅選択をセレクトボックスからボタン一覧に変更。ポップアップは背景タップでは閉じず、✕ボタンのみで閉じるように変更 -->
<!-- 1.4.0: 降車駅の記録をカード内の展開フォームから、index.htmlと統一感のある中央ポップアップに変更 -->
<!-- 1.3.0: 降車駅プルダウンで「→ 〇〇線へ直通」を選ぶと、その路線の駅一覧に切り替わるように対応 -->
<!-- 1.2.1: 降車駅記録の「保存」ボタン連打で重複送信されないよう、送信中は無効化するガードを追加 -->
<!-- 1.2.0: 各投稿カードに「🚏 降車駅を記録」ボタンを追加。1件ずつ任意で降車駅を記録できる -->
<!-- 1.1.0: 全ユーザー分が見えていた不具合を修正し、自分の投稿のみ表示・保存するように変更 -->
<style>
  body {
    font-family: "Hiragino Sans", "Segoe UI", sans-serif;
    background-color: #F7F8FA;
    margin: 0;
    padding: 0;
  }


  h2 {
    text-align: center;
    margin-top: 20px;
    color: #004C97;
  }

  #filterArea {
    text-align: center;
    margin: 10px 0 20px;
  }

  #postContainer {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 20px;
    padding: 20px;
    width: 90%;
    max-width: 1000px;
    margin: auto;
  }

  .card {
    background-color: #fff;
    border-radius: 15px;
    padding: 20px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    border-left: 6px solid #E60012;
  }

  .card h3 {
    margin: 0 0 8px;
    color: #004C97;
    font-size: 18px;
  }

  .card p {
    margin: 4px 0;
    color: #333;
    font-size: 14px;
  }

  .descent-row-btn {
    margin-top: 10px;
    background: #1e8449;
    color: white;
    border: none;
    border-radius: 8px;
    padding: 7px 12px;
    font-size: 13px;
    cursor: pointer;
  }
  .descent-row-btn:hover { background: #E60012; }
  .descent-recorded {
    margin-top: 8px;
    font-size: 13px;
    color: #1e8449;
    font-weight: bold;
    cursor: pointer;
    text-decoration: underline dotted;
  }
  .descent-recorded:hover { color: #004C97; }

  /* ===== 降車駅を記録するポップアップ ===== */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.55);
    z-index: 10000;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(3px);
  }
  .modal-overlay.show { display: flex; }
  .modal-panel {
    background: #FAF6EF;
    border-radius: 20px;
    padding: 22px 20px 20px;
    max-width: 360px;
    width: 90%;
    box-shadow: 0 16px 48px rgba(0,0,0,0.25);
  }
  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    color: #004C97;
    font-weight: bold;
    font-size: 15px;
  }
  .modal-close {
    background: none;
    border: none;
    color: #999;
    font-size: 18px;
    padding: 2px 6px;
    cursor: pointer;
  }
  .modal-close:hover { color: #E60012; }
  .descent-ride-summary {
    background: #EEF4FF;
    border: 1.5px solid #cfe0f2;
    border-radius: 10px;
    padding: 10px 14px;
    font-size: 14px;
    line-height: 1.6;
    color: #17324f;
    margin-bottom: 12px;
  }
  .modal-list {
    max-height: 60vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .modal-list button {
    width: 100%;
    text-align: left;
    background: white;
    color: #333;
    border: 1.5px solid #E3E8F0;
    border-radius: 10px;
    padding: 12px 14px;
    font-size: 15px;
    cursor: pointer;
  }
  .modal-list button:hover,
  .modal-list button:active {
    background: #EEF4FF;
    color: #004C97;
    border-color: #004C97;
  }
  .modal-list button:disabled { opacity: 0.5; cursor: default; }

  #reload {
    text-align: center;
    color: #555;
  }

  /* 更新インジケーター */
  #updateBar {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #004C97;
    color: white;
    padding: 10px 18px;
    border-radius: 30px;
    font-size: 13px;
    font-family: "Hiragino Sans", sans-serif;
    box-shadow: 0 4px 16px rgba(0,0,0,0.2);
    display: none;
    align-items: center;
    gap: 10px;
    z-index: 9000;
    transition: opacity 0.4s;
  }
  #updateBar.show { display: flex; }
  #updateBar.fade { opacity: 0; }
  .update-spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,0.4);
    border-top-color: white;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #updateBar.done .update-spinner { display: none; }
</style>
</head>
<body>

<!-- 降車駅を記録するポップアップ -->
<div id="descentModalOverlay" class="modal-overlay">
  <div class="modal-panel" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span>降車駅を記録</span>
      <button type="button" class="modal-close" onclick="closeDescentModal()">✕</button>
    </div>
    <div id="descentModalBody"></div>
  </div>
</div>

<h2>投稿一覧</h2>

<div id="filterArea">
  <label>月で絞り込み：</label>
  <select id="monthFilter">
    <option value="all">すべて表示</option>
  </select>
</div>

<p id="reload">読み込み中...</p>
<div id="postContainer"></div>

<!-- 更新インジケーター -->
<div id="updateBar">
  <div class="update-spinner"></div>
  <span id="updateMsg">最新データ取得中...</span>
</div>

<script src="nav.js"></script>
<script>initNav("投稿履歴");</script>
<script src="logs.js"></script>
<script>
const username = checkLogin();

const GAS_URL = "https://script.google.com/macros/s/AKfycbyWTr6ejDZKkaw9owEM8yLcl6-6w5pHeyk2hWdX6Lw1INNg5ZxuhvCx7PPfOmxWHC17/exec";
const TRANSFERS_URL = "https://script.google.com/macros/s/AKfycbwOzhHMk2WRtcUHvSMfnrimIQxUk-_dZN_43I-m8fpMNVxomE7emhevGGyC3UnLR3ejBw/exec";
const STATION_URL = "https://opensheet.elk.sh/1ZooIjdlOwsLZVjQv6KN53h4X2JYUyULYuJTuhbgk95s/station";

// 乗車履歴は自分の分だけ表示・保存する（他ユーザー分は保存しない）
const CACHE_KEY = "tuts4_show_cache_" + username;

// 旧バージョンの共有キャッシュ（全ユーザー分が混在して保存されていた）は破棄する
localStorage.removeItem("tuts4_show_cache");

let allData = [];
let stationMaster = [];
let myTransfers = [];

function timeKeyMatch(a, b) {
  if (!a || !b) return false;
  if (String(a) === String(b)) return true;
  const da = new Date(a), db = new Date(b);
  return !isNaN(da) && !isNaN(db) && da.getTime() === db.getTime();
}

function isViaEntry(name) {
  return typeof name === "string" && name.startsWith("via_");
}
function viaTargetRoute(name) {
  return name.slice(4);
}
function formatStationOption(name) {
  return isViaEntry(name) ? `→ ${viaTargetRoute(name)}へ直通` : name;
}

// 各種マスタ・自分のtransfers記録を読み込む（降車駅記録ウィジェット用）
Promise.all([
  fetch(STATION_URL).then(r => r.json()).catch(() => []),
  fetch(TRANSFERS_URL).then(r => r.json()).catch(() => [])
]).then(([stationData, transfersData]) => {
  stationMaster = stationData;
  myTransfers = transfersData.filter(t => String(t["ユーザー名"]) === String(username));
  // 既に描画済みなら降車駅の状態を反映して再描画
  if (allData.length) applyMonthFilter();
});

// ===== 更新バー =====
function showUpdateBar(msg) {
  const bar = document.getElementById("updateBar");
  bar.classList.remove("fade", "done");
  bar.classList.add("show");
  document.getElementById("updateMsg").textContent = msg;
}

function finishUpdateBar(msg) {
  const bar = document.getElementById("updateBar");
  bar.classList.add("done");
  document.getElementById("updateMsg").textContent = msg;
  setTimeout(() => {
    bar.classList.add("fade");
    setTimeout(() => bar.classList.remove("show", "fade", "done"), 400);
  }, 1800);
}

// ===== カード描画 =====
function buildMonthFilter(data) {
  const months = [...new Set(data.map(d => String(d["時刻"]).slice(0, 7)))];
  const select = document.getElementById("monthFilter");
  const current = select.value;
  // 既存の選択肢（all以外）を削除して再構築
  while (select.options.length > 1) select.remove(1);
  months.forEach(m => {
    const o = document.createElement("option");
    o.value = m; o.textContent = m;
    select.appendChild(o);
  });
  if (current) select.value = current;
}

function renderCards(data) {
  const container = document.getElementById("postContainer");
  container.innerHTML = "";

  if (!data || data.length === 0) {
    document.getElementById("reload").textContent = "該当する投稿がありません。";
    return;
  }
  document.getElementById("reload").textContent = "";

  data.forEach(row => {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = String(row["路線"] || "");
    card.appendChild(title);

    const info = [
      ["ユーザー",   row["ユーザー名"]],
      ["発車時刻",   row["時刻"]],
      ["エリア",     row["エリア"]],
      ["区分",       row["区分"]],
      ["乗車駅",     row["乗車駅"]],
      ["種別",       row["種別"]],
      ["行先",       row["行先"]],
      ["車両形式",   row["車両形式"]],
      ["車番",       row["車番"]],
      ["備考",       row["メモ"]],
    ];

    info.forEach(([label, value]) => {
      if (value !== null && value !== undefined && String(value) !== "") {
        const p = document.createElement("p");
        p.innerHTML = `<strong>${label}：</strong>${String(value)}`;
        card.appendChild(p);
      }
    });

    // ===== 降車駅の記録（すでに記録済みならそれを表示、無ければ記録用ボタン） =====
    // 複数回記録されている場合は最新（最後に送信されたもの）を採用＝再記録＝上書き扱いにする
    const rideTime = row["時刻"];
    const existing = [...myTransfers].reverse().find(t => timeKeyMatch(t["元の乗車時刻"], rideTime));

    if (existing) {
      const p = document.createElement("p");
      p.className = "descent-recorded";
      p.textContent = `🚏 降車駅：${existing["降車駅"] || "(不明)"}（タップで書き換え）`;
      p.onclick = () => openDescentModal(row);
      card.appendChild(p);
    } else {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "descent-row-btn";
      btn.textContent = "🚏 降車駅を記録";
      btn.onclick = () => openDescentModal(row);
      card.appendChild(btn);
    }

    container.appendChild(card);
  });
}

function formatRideTimeLabel(rideTime) {
  const d = new Date(rideTime);
  if (isNaN(d)) return String(rideTime || "");
  const pad = n => String(n).padStart(2, "0");
  const weekday = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}(${weekday}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function closeDescentModal() {
  document.getElementById("descentModalOverlay").classList.remove("show");
}

function buildStationButtonsHTML(routeName) {
  const stationsOnRoute = stationMaster.filter(s => s["路線"] === routeName);
  const names = [...new Set(stationsOnRoute.map(s => s["駅名"]))];
  return names.map(n => `<button type="button" class="descent-station-btn" data-station="${n.replace(/"/g, "&quot;")}">${formatStationOption(n)}</button>`).join("");
}

function openDescentModal(row) {
  const body = document.getElementById("descentModalBody");

  const timeLabel = formatRideTimeLabel(row["時刻"]);
  const typeLabel = row["種別"] ? row["種別"] : "";
  const rideSummary = `${timeLabel}<br>${row["路線"] || ""}<br>${row["乗車駅"] || "(乗車駅不明)"} → ${typeLabel}${row["行先"] || ""}行き`;

  let submitting = false;

  function renderStationButtons(routeName) {
    body.innerHTML = `
      <div class="descent-ride-summary">${rideSummary}</div>
      <div class="modal-list">${buildStationButtonsHTML(routeName)}</div>
    `;

    const buttons = body.querySelectorAll(".descent-station-btn");

    // 開いた直後の一瞬（連打・二重クリック対策）はボタンを押せないようにする
    buttons.forEach(btn => { btn.disabled = true; });
    setTimeout(() => {
      if (!submitting) buttons.forEach(btn => { btn.disabled = false; });
    }, 450);

    buttons.forEach(btn => {
      btn.onclick = () => {
        if (submitting || btn.disabled) return; // 連打防止
        const station = btn.dataset.station;

        // 「→ 〇〇線へ直通」を選んだら、そのままその路線の駅一覧に切り替える
        if (isViaEntry(station)) {
          renderStationButtons(viaTargetRoute(station));
          return;
        }

        submitAlightStation(station);
      };
    });
  }

  async function submitAlightStation(alightStation) {
    submitting = true;
    body.querySelectorAll(".descent-station-btn").forEach(b => { b.disabled = true; });

    try {
      await fetch(TRANSFERS_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          username,
          rideTime: row["時刻"],
          alightStation,
          tripId: username + "_" + row["時刻"],
          tripEnd: true
        })
      });
    } catch (e) {
      console.error("降車駅の送信に失敗:", e);
      alert("送信に失敗しました。時間を置いて再試行してください。");
      submitting = false;
      body.querySelectorAll(".descent-station-btn").forEach(b => { b.disabled = false; });
      return;
    }

    // 画面上のキャッシュにも反映して、すぐに「記録済み」表示に切り替える
    myTransfers.push({ "ユーザー名": username, "元の乗車時刻": row["時刻"], "降車駅": alightStation });
    closeDescentModal();
    applyMonthFilter();
  }

  renderStationButtons(row["路線"]);
  document.getElementById("descentModalOverlay").classList.add("show");
}

function applyMonthFilter() {
  const selected = document.getElementById("monthFilter").value;
  renderCards(selected === "all"
    ? allData
    : allData.filter(r => String(r["時刻"]).startsWith(selected))
  );
}

document.getElementById("monthFilter").addEventListener("change", applyMonthFilter);

// ===== ① キャッシュがあれば即表示 =====
const cached = localStorage.getItem(CACHE_KEY);
if (cached) {
  try {
    allData = JSON.parse(cached);
    buildMonthFilter(allData);
    renderCards(allData);
    document.getElementById("reload").textContent = "";
  } catch(e) {
    localStorage.removeItem(CACHE_KEY);
  }
}

// ===== ② バックグラウンドで最新データを取得 =====
showUpdateBar("最新データ取得中...");

fetch(GAS_URL)
  .then(res => {
    // レスポンスサイズが不明なのでXHRでプログレスを擬似表示
    return res.json();
  })
  .then(rawData => {
    // 自分の投稿のみに絞り込んでから保存・表示する
    const data = rawData.filter(r => String(r["ユーザー名"]) === String(username));
    data.reverse();

    // キャッシュと件数が変わっていれば更新
    const isSame = allData.length === data.length &&
      JSON.stringify(data[0]) === JSON.stringify(allData[0]);

    localStorage.setItem(CACHE_KEY, JSON.stringify(data));
    allData = data;
    buildMonthFilter(data);
    applyMonthFilter();

    finishUpdateBar(isSame ? "✅ 最新です" : `✅ ${data.length} 件に更新しました`);
  })
  .catch(() => {
    if (!cached) {
      document.getElementById("reload").textContent = "データ取得エラーが発生しました。";
    }
    finishUpdateBar("⚠️ 更新失敗（キャッシュを表示中）");
  });
</script>

</body>
</html>
