<!-- version: 1.12.2 -->
<!-- 1.12.2: 乗車・降車データの背景更新後、ヘッダーの降車駅未回答ボタンもその場で
           再検証・更新するように対応 -->
<!-- 1.12.1: 運営が他ユーザーの投稿から降車駅を記録しても、ログイン中ユーザー名（運営）で
           送信されてしまい反映されないバグを修正。投稿の実際の持ち主の名前で送信するように -->
<!-- 1.12.0: ポップアップ（降車駅記録・編集）をEscキーでも閉じられるように対応 -->
<!-- 1.11.9: 管理者判定（全ユーザー閲覧）の対象を「運営」のみに限定 -->
<!-- 1.11.8: 運営アカウントでは全ユーザーの投稿を閲覧できるように対応（ユーザーで絞り込み可）。
           運営アカウントは乗車・降車データのキャッシュ保存を行わず、常に最新を取得する。
           編集・削除も、行の実際の投稿者名で送信するように修正（運営が他ユーザーの投稿を
           編集・削除できるように） -->
<!-- 1.11.7: 降車データ（transfers）もローカルキャッシュに保存し、乗車記録と同じく
           ページを開いた瞬間に即表示→裏で最新に更新するように変更。取得中は進捗率も表示 -->
<!-- 1.11.6: 「最新データ取得中...」→「✅最新です」の表示が、乗車記録だけでなく降車データ
           （transfers）の取得完了も待ってから出るように変更。片方だけ終わった状態で
           「最新です」と出てしまうのを防ぐ -->
<!-- 1.11.5: キャッシュ対策（no-cacheメタタグ、logs.js/nav.jsのバージョンクエリ）を追加 -->
<!-- 1.11.4: opensheetがレート制限等で配列以外（エラーオブジェクト）を返すと、
           stationMaster等が壊れて降車登録・編集ボタンが使えなくなるバグを修正。
           配列チェック＋1回だけの自動リトライを追加 -->
<!-- 1.11.3: 片方向のみ運行の環状線（route シートの「環状方向限定」）に対応。
           降車駅記録時に方向を聞かず自動確定するように変更 -->
<!-- 1.11.2: 「🔀 別路線に直通する」ボタンを削除。via_のクイックタップだけで運用する方針のため撤去 -->
<!-- 1.11.1: 降車登録も乗車投稿と同じ「1秒だけ送信中を表示→裏で送信→キャッシュから消す」
           パターンに統一 -->
<!-- 1.11.0: 編集フォームをテキスト入力からマスタデータ連動のプルダウン（エリア→区分→会社→
           路線→乗車駅／種別／行先／車両形式→車番）に変更 -->
<!-- 1.10.0: 各投稿カードに「✏️ 編集」「🗑 削除」ボタンを追加。ridesのGAS(rides_gas.gs)に
           action(edit/delete)対応が必要 -->
<!-- 1.9.3: 環状線のvia_接続駅探索で、方向の解釈が逆だったバグを修正
           （forward方向に進む場合、via_の直前の駅はbackward側にある） -->
<!-- 1.9.2: 環状線でvia_の接続駅を探す時、直線用の判定がループでは通用しないバグを修正。
           内回り／外回りの向きをそのまま使って接続駅を探すように変更 -->
<!-- 1.9.1: routeシートの「環状反転」列に対応。内回り／外回りのボタンに「（隣の駅）方面」の
           ヒントを表示するように変更 -->
<!-- 1.9.0: 環状線の場合、降車駅を記録する時に「内回り／外回り」も一緒に聞くように変更。
           過去の投稿にも遡って正確な方向を記録できる（route取得を追加） -->
<!-- 1.8.7: 位置ベースのvia_解決で方向判定が抜けていたバグを修正（常に後方優先になってしまい、
           敦賀発で近江塩津ではなく余呉が出ていた）。基準駅の位置を見て正しい方向を優先するように復活 -->
<!-- 1.8.6: 降車駅ポップアップのvia_解決を、名前検索ではなくシート上の実際の位置から
           直接、隣の拠点駅を割り出す方式に変更（#タグ不要で東西線パターンに対応） -->
<!-- 1.8.5: via_に "#タグ" で区別できるように対応（東西線のように両端が同じ路線に直通するケース） -->
<!-- 1.8.4: 直通が絡む降車駅の表示を「接続駅@次路線|...」の生データそのままではなく、
           「路線1・路線2直通 降車駅」という読みやすい形に整形（保存データ自体は変更なし） -->
<!-- 1.8.3: 送信待ち表示を「(送信待ち) ⏳送信待ち」から「⏳降車駅名」に整理。
           送信待ちキューの中身から実際の降車駅名を読んで表示するように変更 -->
<!-- 1.8.2: GASのdoGetが復旧したので、transfers読み込みをopensheet経由からGAS経由に戻した
           （opensheetのキャッシュによる反映ラグを避けるため。即時反映になる） -->
<!-- 1.8.1: transfers用GASへの送信からno-corsを廃止。実際にGASの{status:"ok"|"error"}という
           返事を読んで成否を判定できるように変更 -->
<!-- 1.8.0: 降車駅の送信を「ローカル送信待ちキュー→裏で送信→成功で削除」方式に変更。
           まだGASに届いていない間は「⏳送信待ち」マークをカードに表示。ページを開いた時・
           オンライン復帰時に自動で再送する -->
<!-- 1.7.4: transfersの「元の乗車時刻」に付くようになった"乗車_"接頭辞を、opensheet経由の
           読み込み時に取り除くように対応（GAS側の日付型誤変換対策の一環） -->
<!-- 1.7.3: transfersの読み込みをGAS(doGet)からopensheet.elk.sh経由に変更（GASの疎通不良の
           影響を受けないように）。書き込み（降車駅の記録）は引き続きGAS経由 -->
<!-- 1.7.2: via_の隣接実駅の探索方向が常に「後方優先」固定になっていたバグを修正。
           基準駅の位置を見て正しい方向を優先して探すように変更 -->
<!-- 1.7.1: 「via_〇〇へ直通」を直接タップするクイックジャンプ経路で、接続駅・経由路線が
           チェーンとして記録されていなかったバグを修正。タップした瞬間に隣接する実駅を
           自動で接続駅としてチェーンに積むように変更 -->
<!-- 1.7.0: 降車駅ポップアップに複数路線をまたぐ直通乗り継ぎ記録（🔀 別路線に直通する）を追加 -->
<!-- 1.6.0: 降車駅ボタン表示直後0.45秒は誤タップ防止のため押せないように変更。
           記録済みの降車駅をタップすると再度選び直せる（上書き）ように対応 -->
<!-- 1.5.0: 降車駅選択をセレクトボックスからボタン一覧に変更。ポップアップは背景タップでは閉じず、✕ボタンのみで閉じるように変更 -->
<!-- 1.4.0: 降車駅の記録をカード内の展開フォームから、index.htmlと統一感のある中央ポップアップに変更 -->
<!-- 1.3.0: 降車駅プルダウンで「→ 〇〇線へ直通」を選ぶと、その路線の駅一覧に切り替わるように対応 -->
<!-- 1.2.1: 降車駅記録の「保存」ボタン連打で重複送信されないよう、送信中は無効化するガードを追加 -->
<!-- 1.2.0: 各投稿カードに「🚏 降車駅を記録」ボタンを追加。1件ずつ任意で降車駅を記録できる -->

<script>
const username = checkLogin();
const IS_ADMIN = (username === "運営");

const GAS_URL = "https://script.google.com/macros/s/AKfycbyWTr6ejDZKkaw9owEM8yLcl6-6w5pHeyk2hWdX6Lw1INNg5ZxuhvCx7PPfOmxWHC17/exec";
// 編集・削除の書き込みは、投稿フォーム（index.html）が使っているのと同じGASのデプロイ先へ送る
const RIDES_WRITE_URL = "https://script.google.com/macros/s/AKfycbzuhYRx9gyb5J1a-6ZuxmcCepIU1hIMnuBo58wh5CTYMWE785YAnuJY4ckm_13-ZHc7/exec";
const TRANSFERS_URL = "https://script.google.com/macros/s/AKfycbwOzhHMk2WRtcUHvSMfnrimIQxUk-_dZN_43I-m8fpMNVxomE7emhevGGyC3UnLR3ejBw/exec";
// 読み込みはopensheet経由にする（GASのdoGetがアクセスできない状態でも読めるように）
const TRANSFERS_READ_URL = TRANSFERS_URL; // GASのdoGetが復旧したので、opensheetの反映ラグを避けてこちらに戻す
const STATION_URL = "https://opensheet.elk.sh/1ZooIjdlOwsLZVjQv6KN53h4X2JYUyULYuJTuhbgk95s/station";

// 乗車履歴は自分の分だけ表示・保存する（他ユーザー分は保存しない）
const CACHE_KEY = "tuts4_show_cache_" + username;

// 旧バージョンの共有キャッシュ（全ユーザー分が混在して保存されていた）は破棄する
localStorage.removeItem("tuts4_show_cache");

let allData = [];
let stationMaster = [];
let myTransfers = [];

// 降車データもキャッシュしておき、乗車記録と同様に即表示→裏で更新できるようにする
// （運営アカウントは全ユーザー分を常に最新で見たいので、キャッシュは使わない）
const TRANSFERS_CACHE_KEY = "tuts4_transfers_cache_" + username;
if (!IS_ADMIN) {
  try {
    const cachedTransfers = localStorage.getItem(TRANSFERS_CACHE_KEY);
    if (cachedTransfers) myTransfers = JSON.parse(cachedTransfers);
  } catch (e) {
    localStorage.removeItem(TRANSFERS_CACHE_KEY);
  }
}

let routeMaster = [];

function isCircularRoute(routeVal) {
  const row = (routeMaster || []).find(r => r["路線"] === routeVal);
  if (!row) return false;
  const v = row["環状"];
  return v === true || v === 1 || ["true", "TRUE", "1", "はい", "有", "✓"].includes(String(v).trim());
}

function isCircularReversed(routeVal) {
  const row = (routeMaster || []).find(r => r["路線"] === routeVal);
  if (!row) return false;
  const v = row["環状反転"];
  return v === true || v === 1 || ["true", "TRUE", "1", "はい", "有", "✓"].includes(String(v).trim());
}

function getCircularFixedDirection(routeVal) {
  const row = (routeMaster || []).find(r => r["路線"] === routeVal);
  if (!row) return null;
  const v = String(row["環状方向限定"] || "").trim();
  if (v.includes("外回り")) return "外回り";
  if (v.includes("内回り")) return "内回り";
  return null;
}

function circularNeighborLabel(routeVal, boardingStation, wantOuter) {
  const rows = stationMaster.filter(r => r["路線"] === routeVal).map(r => r["駅名"]).filter(n => !isViaEntry(n));
  const idx = rows.indexOf(boardingStation);
  if (idx === -1 || rows.length < 2) return "";
  const reversed = isCircularReversed(routeVal);
  const goForward = reversed ? !wantOuter : wantOuter;
  const total = rows.length;
  const neighborIdx = goForward ? (idx + 1) % total : (idx - 1 + total) % total;
  return rows[neighborIdx] || "";
}

function timeKeyMatch(a, b) {
  if (!a || !b) return false;
  if (String(a) === String(b)) return true;
  const da = new Date(a), db = new Date(b);
  return !isNaN(da) && !isNaN(db) && da.getTime() === db.getTime();
}

function isViaEntry(name) {
  return typeof name === "string" && name.startsWith("via_");
}
function viaTargetRoute(name) {
  // "#" 以降はディスアンビゲーション用のタグ（東西線の両端が同じ路線に直通する場合などに使う）
  return name.slice(4).split("#")[0];
}
function formatStationOption(name) {
  return isViaEntry(name) ? `→ ${viaTargetRoute(name)}へ直通` : name;
}

// via_駅名の位置の前後で、一番近い「実駅」（via_ではない駅）を探す
// （降車駅ポップアップで via_ を直接タップした際に、接続駅として自動記録するために使う）
// via_駅名の位置の前後で、一番近い「実駅」（via_ではない駅）を探す
// referenceStation（今来た側の駅）が分かれば、その駅がvia_より前か後ろかで探す方向を決める
// （降車駅ポップアップで via_ を直接タップした際に、接続駅として自動記録するために使う）
// 各種マスタ・自分のtransfers記録を読み込む（降車駅記録ウィジェット用）
const RIDE_TIME_PREFIX = "乗車_";

// scripts.js（index.html）と共有のローカル送信待ちキュー。ここに残っている間は
// まだGASへの送信が完了していない（＝スプシにはまだ反映されていない）ことを示す
const PENDING_TRANSFERS_KEY = "tuts4_pending_transfers";
function getPendingTransfers() {
  try { return JSON.parse(localStorage.getItem(PENDING_TRANSFERS_KEY) || "[]"); }
  catch (e) { return []; }
}
function setPendingTransfers(list) {
  localStorage.setItem(PENDING_TRANSFERS_KEY, JSON.stringify(list));
}
function getPendingTransferFor(uname, rideTime) {
  return getPendingTransfers().find(e => e.payload.username === uname && timeKeyMatch(e.payload.rideTime, rideTime)) || null;
}

// スプシに保存されてる生の値（"接続駅@次路線|接続駅@次路線|最終降車駅"）を解析する
function parseDescentChain(raw) {
  let s = typeof raw === "string" ? raw : "";
  let circularDir = null;
  const m = s.match(/^\[環状:(外回り|内回り)\](.*)$/);
  if (m) { circularDir = m[1]; s = m[2]; }

  if (!s.includes("|") && !s.includes("@")) return { hops: [], finalStation: s, circularDir };
  const parts = s.split("|");
  const finalStation = parts.pop();
  const hops = parts.map(p => {
    const [junction, nextRoute] = p.split("@");
    return { junction, nextRoute };
  }).filter(h => h.junction && h.nextRoute);
  return { hops, finalStation, circularDir };
}

// 表示専用の整形：直通が絡む場合は「路線1・路線2直通 降車駅」のようにまとめる
// （スプレッドシート側の生データはそのまま。見た目だけ変える）
function formatAlightDisplay(raw) {
  const chain = parseDescentChain(raw);
  const dirPrefix = chain.circularDir ? `【${chain.circularDir}】` : "";
  if (!chain.hops.length) return dirPrefix + chain.finalStation; // 直通なし・単純な駅名ならそのまま
  const routes = chain.hops.map(h => h.nextRoute);
  return `${dirPrefix}${routes.join("・")}直通 ${chain.finalStation}`;
}

// transfers用GASへの送信は no-cors をやめて、実際に成否を確認できる形で送る
async function postToTransfersGAS(payload) {
  const res = await fetch(TRANSFERS_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (data && data.status && data.status !== "ok") {
    throw new Error(data.message || "GAS側でエラーが発生しました");
  }
  return data;
}
function stripRideTimePrefix(v) {
  return typeof v === "string" && v.indexOf(RIDE_TIME_PREFIX) === 0 ? v.slice(RIDE_TIME_PREFIX.length) : v;
}

// 編集・削除はno-corsを使わず、実際にGASの{result:"success"|"error"}を読んで成否を判定する
async function postToRidesGAS(payload) {
  const res = await fetch(RIDES_WRITE_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload)
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
  const data = await res.json();
  if (data && data.result && data.result !== "success") {
    throw new Error(data.message || "GAS側でエラーが発生しました");
  }
  return data;
}

const ROUTE_URL = "https://opensheet.elk.sh/1ZooIjdlOwsLZVjQv6KN53h4X2JYUyULYuJTuhbgk95s/route";

// opensheetがレート制限等で配列以外（エラーオブジェクト）を返すことがあるため、
// 1回だけ少し待ってから自動リトライする
async function fetchJsonArrayWithRetry(url) {
  for (let attempt = 0; attempt < 2; attempt++) {
    try {
      const res = await fetch(url);
      const data = await res.json();
      if (Array.isArray(data)) return data;
    } catch (e) { /* 下でリトライ */ }
    if (attempt === 0) await new Promise(r => setTimeout(r, 1200));
  }
  return [];
}

// ===== update バーは、乗車記録と降車データ（transfers含む）の両方が揃ってから完了扱いにする =====
let _ridesFetchDone = false;
let _masterFetchDone = false;
let _pendingUpdateMsg = "";
let _updateBarErrored = false;
let _updateBarFinished = false;

function maybeFinishUpdateBar() {
  if (_updateBarErrored) return;
  if (!_ridesFetchDone || !_masterFetchDone) return;
  _updateBarFinished = true;
  finishUpdateBar(_pendingUpdateMsg);
}

// ===== 進捗率表示（乗車記録1件＋マスタ/降車データ10件＝計11件の取得をカウント） =====
const _TOTAL_FETCH_COUNT = 11;
let _completedFetchCount = 0;

function trackFetchProgress(promise) {
  return promise.then(result => {
    _completedFetchCount++;
    const pct = Math.min(100, Math.round((_completedFetchCount / _TOTAL_FETCH_COUNT) * 100));
    const msgEl = document.getElementById("updateMsg");
    if (msgEl && !_updateBarFinished) {
      msgEl.textContent = `最新データ取得中...（残り${100 - pct}%）`;
    }
    return result;
  });
}

Promise.all([
  trackFetchProgress(fetchJsonArrayWithRetry(STATION_URL)),
  trackFetchProgress(fetch(TRANSFERS_READ_URL).then(r => r.json()).catch(() => [])),
  trackFetchProgress(fetchJsonArrayWithRetry(ROUTE_URL)),
  trackFetchProgress(fetchJsonArrayWithRetry(AREA_URL)),
  trackFetchProgress(fetchJsonArrayWithRetry(TYPE_URL)),
  trackFetchProgress(fetchJsonArrayWithRetry(COUNTRY_URL)),
  trackFetchProgress(fetchJsonArrayWithRetry(SUJITYPE_URL)),
  trackFetchProgress(fetchJsonArrayWithRetry(BOUND_URL)),
  trackFetchProgress(fetchJsonArrayWithRetry(MODEL_URL)),
  trackFetchProgress(fetchJsonArrayWithRetry(NUMBER_URL))
]).then(([stationData, transfersData, routeData, areaData, typeData, countryData, sujitypeData, boundData, modelData, numberData]) => {
  const asArray = v => Array.isArray(v) ? v : [];
  stationMaster = asArray(stationData);
  routeMaster = asArray(routeData);
  allAreaData = asArray(areaData);
  allTypeData = asArray(typeData);
  allCountryData = asArray(countryData);
  allSujitypeData = asArray(sujitypeData);
  allBoundData = asArray(boundData);
  allModelData = asArray(modelData);
  allNumberData = asArray(numberData);
  myTransfers = asArray(transfersData)
    .filter(t => IS_ADMIN || String(t["ユーザー名"]) === String(username))
    .map(t => ({ ...t, "元の乗車時刻": stripRideTimePrefix(t["元の乗車時刻"]) }));
  if (!IS_ADMIN) {
    try { localStorage.setItem(TRANSFERS_CACHE_KEY, JSON.stringify(myTransfers)); } catch (e) { /* 容量超過等は無視 */ }
  }
  if (typeof refreshNavDescentButton === "function") refreshNavDescentButton();
  // 既に描画済みなら降車駅の状態を反映して再描画
  if (allData.length) applyMonthFilter();
}).finally(() => {
  _masterFetchDone = true;
  maybeFinishUpdateBar();
});

function showUpdateBar(msg) {
  const bar = document.getElementById("updateBar");
  bar.classList.remove("fade", "done");
  bar.classList.add("show");
  document.getElementById("updateMsg").textContent = msg;
}

function finishUpdateBar(msg) {
  const bar = document.getElementById("updateBar");
  bar.classList.add("done");
  document.getElementById("updateMsg").textContent = msg;
  setTimeout(() => {
    bar.classList.add("fade");
    setTimeout(() => bar.classList.remove("show", "fade", "done"), 400);
  }, 1800);
}

// ===== カード描画 =====
function buildMonthFilter(data) {
  const months = [...new Set(data.map(d => String(d["時刻"]).slice(0, 7)))];
  const select = document.getElementById("monthFilter");
  const current = select.value;
  // 既存の選択肢（all以外）を削除して再構築
  while (select.options.length > 1) select.remove(1);
  months.forEach(m => {
    const o = document.createElement("option");
    o.value = m; o.textContent = m;
    select.appendChild(o);
  });
  if (current) select.value = current;
}

function renderCards(data) {
  const container = document.getElementById("postContainer");
  container.innerHTML = "";

  if (!data || data.length === 0) {
    document.getElementById("reload").textContent = "該当する投稿がありません。";
    return;
  }
  document.getElementById("reload").textContent = "";

  data.forEach(row => {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h3");
    title.textContent = String(row["路線"] || "");
    card.appendChild(title);

    const info = [
      ["ユーザー",   row["ユーザー名"]],
      ["発車時刻",   row["時刻"]],
      ["エリア",     row["エリア"]],
      ["区分",       row["区分"]],
      ["乗車駅",     row["乗車駅"]],
      ["種別",       row["種別"]],
      ["行先",       row["行先"]],
      ["車両形式",   row["車両形式"]],
      ["車番",       row["車番"]],
      ["備考",       row["メモ"]],
    ];

    info.forEach(([label, value]) => {
      if (value !== null && value !== undefined && String(value) !== "") {
        const p = document.createElement("p");
        p.innerHTML = `<strong>${label}：</strong>${String(value)}`;
        card.appendChild(p);
      }
    });

    // ===== 降車駅の記録（すでに記録済みならそれを表示、無ければ記録用ボタン） =====
    // 複数回記録されている場合は最新（最後に送信されたもの）を採用＝再記録＝上書き扱いにする
    const rideTime = row["時刻"];
    const rowUsername = row["ユーザー名"] || username;
    const existing = [...myTransfers].reverse().find(t =>
      String(t["ユーザー名"]) === String(rowUsername) && timeKeyMatch(t["元の乗車時刻"], rideTime)
    );
    const pendingEntry = getPendingTransferFor(rowUsername, rideTime);

    if (existing || pendingEntry) {
      const p = document.createElement("p");
      p.className = "descent-recorded";
      const label = pendingEntry ? pendingEntry.payload.alightStation : existing["降車駅"];
      const icon = pendingEntry ? "⏳" : "";
      p.textContent = `🚏 降車駅：${icon}${formatAlightDisplay(label)}（タップで書き換え）`;
      p.onclick = () => openDescentModal(row);
      card.appendChild(p);
    } else {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "descent-row-btn";
      btn.textContent = "🚏 降車駅を記録";
      btn.onclick = () => openDescentModal(row);
      card.appendChild(btn);
    }

    // ===== 投稿の編集・削除 =====
    const editRow = document.createElement("div");
    editRow.className = "card-edit-row";
    editRow.innerHTML = `
      <button type="button" class="edit-btn">✏️ 編集</button>
      <button type="button" class="delete-btn">🗑 削除</button>
    `;
    editRow.querySelector(".edit-btn").onclick = () => openEditModal(row);
    editRow.querySelector(".delete-btn").onclick = () => deleteRide(row);
    card.appendChild(editRow);

    container.appendChild(card);
  });
}

function formatRideTimeLabel(rideTime) {
  const d = new Date(rideTime);
  if (isNaN(d)) return String(rideTime || "");
  const pad = n => String(n).padStart(2, "0");
  const weekday = ["日", "月", "火", "水", "木", "金", "土"][d.getDay()];
  return `${d.getFullYear()}/${pad(d.getMonth() + 1)}/${pad(d.getDate())}(${weekday}) ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function toDatetimeLocalValue(stored) {
  // "yyyy-MM-dd HH:mm" -> "yyyy-MM-ddTHH:mm"（datetime-local入力欄の形式に合わせる）
  return typeof stored === "string" ? stored.replace(" ", "T") : "";
}

function uniq(arr) { return [...new Set(arr)].filter(v => v !== undefined && v !== null && v !== ""); }

function buildSelectHTML(id, options, selected) {
  const opts = ['<option value="">選択してください</option>']
    .concat(options.map(v => `<option value="${v}"${v === selected ? " selected" : ""}>${v}</option>`));
  return `<select id="edit_${id}">${opts.join("")}</select>`;
}

  if (!confirm(`この投稿を削除しますか？\n\n${row["路線"] || ""} / ${row["時刻"] || ""}\n\nこの操作は取り消せません。`)) return;

  try {
    await postToRidesGAS({
      action: "delete",
      usernameValue: row["ユーザー名"] || username,
      originalTimeValue: row["時刻"]

    localStorage.removeItem(CACHE_KEY);
    location.reload();
  } catch (e) {
    console.error("削除に失敗:", e);
    alert("削除に失敗しました: " + e.message);
  }
}

function openDescentModal(row) {
  document.getElementById("modalHeaderTitle").textContent = "降車駅を記録";
  const body = document.getElementById("descentModalBody");

  const timeLabel = formatRideTimeLabel(row["時刻"]);
  const typeLabel = row["種別"] ? row["種別"] : "";
  const rideSummary = `${timeLabel}<br>${row["路線"] || ""}<br>${row["乗車駅"] || "(乗車駅不明)"} → ${typeLabel}${row["行先"] || ""}行き`;

  const chain = []; // [{ junction, nextRoute }, ...]
  let currentRoute = row["路線"];
  let legRefStation = row["乗車駅"]; // 今の路線に入ってきた側の基準駅（方向判定に使う）
  const circularFixedDir = isCircularRoute(row["路線"]) ? getCircularFixedDirection(row["路線"]) : null;
  let circularDir = circularFixedDir;
  let mode = (isCircularRoute(row["路線"]) && !circularFixedDir) ? "circularDir" : "station"; // "circularDir" | "station" | "junction" | "route"
  let submitting = false;

  function breadcrumbHTML() {
    if (!chain.length) return "";
    let html = `<span>${row["路線"]}</span>`;
    chain.forEach(h => { html += ` → <span style="color:#888;">[${h.junction}]</span> → <span>${h.nextRoute}</span>`; });
    return `<div class="descent-breadcrumb">${html}</div>`;
  }

  function stationNamesFor(routeName) {
    const rows = stationMaster.filter(s => s["路線"] === routeName);
    return [...new Set(rows.map(s => s["駅名"]))];
  }

  // via_はその「位置」から直接、隣の拠点駅を割り出して使う（東西線のように両端が
  // 同じ路線に直通していても、indexOfによる名前検索に頼らず正しく区別できる）
  function buildStationItems(routeName) {
    const rawRows = stationMaster.filter(s => s["路線"] === routeName).map(s => s["駅名"]);
    const refRawIdx = legRefStation ? rawRows.indexOf(legRefStation) : -1;
    const circular = isCircularRoute(routeName);
    const reversed = circular ? isCircularReversed(routeName) : false;
    const seen = new Set();
    const items = [];

    rawRows.forEach((name, rawIdx) => {
      if (isViaEntry(name)) {
        const nextRoute = viaTargetRoute(name);

        let neighbor = null;
        const tryBackward = () => { for (let i = rawIdx - 1; i >= 0; i--) if (!isViaEntry(rawRows[i])) return rawRows[i]; return null; };
        const tryForward = () => { for (let i = rawIdx + 1; i < rawRows.length; i++) if (!isViaEntry(rawRows[i])) return rawRows[i]; return null; };

        if (circular && circularDir) {
          const wantsOuter = circularDir === "外回り";
          const goForward = reversed ? !wantsOuter : wantsOuter;
          neighbor = goForward ? (tryBackward() || tryForward()) : (tryForward() || tryBackward());
        } else if (refRawIdx !== -1) {
          neighbor = refRawIdx > rawIdx ? (tryForward() || tryBackward()) : (tryBackward() || tryForward());
        } else {
          neighbor = tryBackward() || tryForward();
        }
        if (!neighbor) return;

        const key = "via|" + neighbor + "|" + nextRoute;
        if (seen.has(key)) return;
        seen.add(key);
        items.push({
          label: `→ ${nextRoute}へ直通（${neighbor}）`,
          onClick: () => {
            chain.push({ junction: neighbor, nextRoute });
            currentRoute = nextRoute;
            legRefStation = neighbor;
            render();
          }
        });
      } else {
        const key = "st|" + name;
        if (seen.has(key)) return;
        seen.add(key);
        items.push({ label: name, onClick: () => finishAndSubmit(name) });
      }
    });

    return items;
  }

  function allRouteNames() {
    return [...new Set(stationMaster.map(s => s["路線"]))].filter(Boolean).sort();
  }

  function render() {
    let promptText = "";
    let items = [];

    if (mode === "circularDir") {
      promptText = `↑${currentRoute}は環状線です。この乗車はどちら回りでしたか？`;
      items = [["外回り", true], ["内回り", false]].map(([label, wantOuter]) => {
        const neighbor = circularNeighborLabel(currentRoute, row["乗車駅"], wantOuter);
        return {
          label: neighbor ? `${label}（${neighbor}方面）` : label,
          onClick: () => { circularDir = label; mode = "station"; render(); }
        };
      });
    } else if (mode === "station") {
      items = buildStationItems(currentRoute);
    } else if (mode === "junction") {
      promptText = `↑${currentRoute}のどの駅で乗り換え・直通しますか？`;
      items = stationNamesFor(currentRoute)
        .filter(n => !isViaEntry(n))
        .map(n => ({
          label: n,
          onClick: () => { chain.push({ junction: n, nextRoute: null }); mode = "route"; render(); }
        }));
      items.push({
        label: "← 戻る",
        extraClass: "descent-back-btn",
        onClick: () => { mode = "station"; render(); }
      });
    } else if (mode === "route") {
      promptText = "↑次はどの路線に直通しますか？";
      items = allRouteNames().map(n => ({
        label: n,
        onClick: () => {
          chain[chain.length - 1].nextRoute = n;
          currentRoute = n;
          legRefStation = chain[chain.length - 1].junction;
          mode = "station";
          render();
        }
      }));
      items.push({
        label: "← 戻る",
        extraClass: "descent-back-btn",
        onClick: () => { chain.pop(); mode = "junction"; render(); }
      });
    }

    const itemsHTML = items.map((it, i) =>
      `<button type="button" class="${it.extraClass || ""}" data-i="${i}">${it.label}</button>`
    ).join("");

    body.innerHTML = `
      <div class="descent-ride-summary">${rideSummary}</div>
      ${breadcrumbHTML()}
      ${promptText ? `<p class="modal-loading" style="margin-bottom:8px;">${promptText}</p>` : ""}
      <div class="modal-list">${itemsHTML}</div>
    `;

    const buttons = body.querySelectorAll(".modal-list button");
    buttons.forEach(btn => { btn.disabled = true; });
    setTimeout(() => { if (!submitting) buttons.forEach(btn => { btn.disabled = false; }); }, 450);

    buttons.forEach((btn, i) => {
      btn.onclick = () => { if (!submitting && !btn.disabled) items[i].onClick(); };
    });
  }

  async function finishAndSubmit(finalStation) {
    let alightStation = finalStation;
    if (chain.length) {
      alightStation = chain.map(h => `${h.junction}@${h.nextRoute}`).join("|") + "|" + finalStation;
    }
    if (circularDir) {
      alightStation = `[環状:${circularDir}]${alightStation}`;
    }

    submitting = true;
    body.querySelectorAll(".modal-list button").forEach(b => { b.disabled = true; });
    body.insertAdjacentHTML("beforeend", '<p class="modal-loading" style="margin-top:10px;">送信中...</p>');

    const rowUsername = row["ユーザー名"] || username;
    const payload = {
      username: rowUsername,
      rideTime: row["時刻"],
      alightStation,
      tripId: rowUsername + "_" + row["時刻"],
      tripEnd: true
    };

    const entryId = Date.now() + "_" + Math.random().toString(36).slice(2);
    const queue = getPendingTransfers();
    queue.push({ id: entryId, payload });
    setPendingTransfers(queue);

    // 裏で実際に送信する（結果を待たず、1秒後にUIを先に進める）
    postToTransfersGAS(payload)
      .then(() => {
        setPendingTransfers(getPendingTransfers().filter(e => e.id !== entryId));
        myTransfers.push({ "ユーザー名": rowUsername, "元の乗車時刻": row["時刻"], "降車駅": alightStation });
        applyMonthFilter();
      })
      .catch(e => console.error("降車駅の送信に失敗（あとで自動的に再送します）:", e));

    await new Promise(r => setTimeout(r, 1000));

    closeDescentModal();
    applyMonthFilter();
  }

  render();
  document.getElementById("descentModalOverlay").classList.add("show");
}

// ページを開いた時、まだ送信できてない降車駅記録があれば裏で再送を試みる
async function flushPendingTransfers() {
  const queue = getPendingTransfers();
  if (!queue.length) return;

  const stillPending = [];
  for (const entry of queue) {
    try {
      await postToTransfersGAS(entry.payload);
    } catch (e) {
      console.error("降車駅の再送信に失敗（次回また試します）:", e);
      stillPending.push(entry);
    }
  }
  setPendingTransfers(stillPending);
  applyMonthFilter();
}
window.addEventListener("load", () => setTimeout(flushPendingTransfers, 1500));
window.addEventListener("online", flushPendingTransfers);

function applyMonthFilter() {
  const selected = document.getElementById("monthFilter").value;
  let rows = selected === "all" ? allData : allData.filter(r => String(r["時刻"]).startsWith(selected));

  if (IS_ADMIN) {
    const userSel = document.getElementById("userFilter").value;
    if (userSel !== "all") rows = rows.filter(r => String(r["ユーザー名"]) === userSel);
  }

  renderCards(rows);
}

document.getElementById("monthFilter").addEventListener("change", applyMonthFilter);
document.getElementById("userFilter").addEventListener("change", applyMonthFilter);

function buildUserFilter(data) {
  if (!IS_ADMIN) return;
  const sel = document.getElementById("userFilter");
  const current = sel.value;
  const users = [...new Set(data.map(r => String(r["ユーザー名"] || "")))].filter(Boolean).sort();
  sel.innerHTML = '<option value="all">全ユーザー</option>' + users.map(u => `<option value="${u}">${u}</option>`).join("");
  if (users.includes(current)) sel.value = current;
  document.getElementById("userFilterLabel").style.display = "";
  sel.style.display = "";
}

if (IS_ADMIN) {
  // 運営アカウントは常に全ユーザーの最新データを取得する（キャッシュ保存はしない）
  showUpdateBar("全ユーザーのデータ取得中...");

  fetch(GAS_URL)
    .then(res => trackFetchProgress(res.json()))
    .then(rawData => {
      const data = [...rawData].reverse();
      allData = data;
      buildMonthFilter(data);
      buildUserFilter(data);
      applyMonthFilter();

      _pendingUpdateMsg = `✅ 全ユーザー ${data.length} 件を取得しました`;
      _ridesFetchDone = true;
      maybeFinishUpdateBar();
    })
    .catch(() => {
      document.getElementById("reload").textContent = "データ取得エラーが発生しました。";
      _ridesFetchDone = true;
      _updateBarErrored = true;
      maybeFinishUpdateBar();
    });
} else {
  // ===== ① キャッシュがあれば即表示 =====
  const cached = localStorage.getItem(CACHE_KEY);
  if (cached) {
    try {
      allData = JSON.parse(cached);
      buildMonthFilter(allData);
      renderCards(allData);
      document.getElementById("reload").textContent = "";
    } catch(e) {
      localStorage.removeItem(CACHE_KEY);
    }
  }

  // ===== ② バックグラウンドで最新データを取得 =====
  showUpdateBar("最新データ取得中...");

  fetch(GAS_URL)
    .then(res => trackFetchProgress(res.json()))
    .then(rawData => {
      // 自分の投稿のみに絞り込んでから保存・表示する
      const data = rawData.filter(r => String(r["ユーザー名"]) === String(username));
      data.reverse();

      // キャッシュと件数が変わっていれば更新
      const isSame = allData.length === data.length &&
        JSON.stringify(data[0]) === JSON.stringify(allData[0]);

      localStorage.setItem(CACHE_KEY, JSON.stringify(data));
      allData = data;
      buildMonthFilter(data);
      applyMonthFilter();
      if (typeof refreshNavDescentButton === "function") refreshNavDescentButton();

      _pendingUpdateMsg = isSame ? "✅ 最新です（降車データ含む）" : `✅ ${data.length} 件に更新しました`;
      _ridesFetchDone = true;
      maybeFinishUpdateBar();
    })
    .catch(() => {
      if (!cached) {
        document.getElementById("reload").textContent = "データ取得エラーが発生しました。";
      }
      _ridesFetchDone = true;
      _updateBarErrored = true;
      finishUpdateBar("⚠️ 更新失敗（キャッシュを表示中）");
    });
}
</script>
