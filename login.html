<!DOCTYPE html>
<html lang="ja">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ログイン | tuts4</title>
<!-- version: 2.2.0 -->
<!-- 2.2.0: 運営ログインのユーザー名を固定（自由入力欄を廃止）。他の名前でこのフォームから
           ログインできないように修正 -->
<!-- 2.1.1: キャッシュ対策（no-cacheメタタグ）を追加 -->
<!-- 2.1.0: ログイン成功時にloginVersion="2"を記録するように対応（旧キャッシュの強制ログアウト用） -->
<!-- 2.0.0: Googleログインを追加。初回のみ「今までのユーザー名」を紐付けることで、
           過去データ（ユーザー名ベース）をそのまま引き継げるようにした。
           運営アカウントは従来通りのユーザー名＋アクセスキー方式を別枠で維持 -->
<!-- 1.0.0: ユーザー名＋共通アクセスキーのみのログイン -->
<style>
  body {
    font-family: "Hiragino Sans", "Segoe UI", sans-serif;
    background-color: #F7F8FA;
    margin: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 20px 0;
    box-sizing: border-box;
  }

  main {
    background: #fff;
    border-radius: 15px;
    padding: 25px 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    max-width: 350px;
    width: 90%;
    text-align: center;
  }

  h2 {
    color: #004C97;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    padding: 10px;
    margin-bottom: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
    font-size: 14px;
    box-sizing: border-box;
  }

  button {
    width: 100%;
    background-color: #004C97;
    color: white;
    border: none;
    padding: 10px;
    border-radius: 6px;
    font-size: 15px;
    cursor: pointer;
    transition: 0.2s;
  }

  button:hover {
    background-color: #E60012;
  }

  p {
    font-size: 13px;
    color: #666;
  }

  #googleSignInDiv {
    display: flex;
    justify-content: center;
    margin-bottom: 14px;
  }

  .divider {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #aaa;
    font-size: 12px;
    margin: 18px 0;
  }
  .divider::before, .divider::after {
    content: "";
    flex: 1;
    height: 1px;
    background: #e0e0e0;
  }

  .admin-toggle {
    background: none;
    color: #888;
    text-decoration: underline;
    font-size: 12px;
    padding: 4px;
    margin-top: 10px;
  }
  .admin-toggle:hover { background: none; color: #E60012; }

  #adminForm { display: none; }

  #linkForm { display: none; }
</style>
</head>
<body>

  <main>
    <h2>🔐 ログイン</h2>

    <!-- Googleログイン（メイン） -->
    <div id="googleLoginArea">
      <div id="googleSignInDiv"></div>
      <p id="googleMsg"></p>
    </div>

    <!-- 初回のみ：既存ユーザー名との紐付け -->
    <div id="linkForm">
      <p style="color:#004C97; font-weight:bold;">初めてのログインですね！<br>今までお使いのユーザー名を入力してください。</p>
      <input type="text" id="linkUsername" placeholder="今までのユーザー名">
      <button onclick="submitLink()">このユーザー名で紐付ける</button>
      <p id="linkMsg"></p>
    </div>

    <div class="divider">または</div>
    <button type="button" class="admin-toggle" onclick="toggleAdminForm()">運営アカウントでログイン</button>

    <!-- 運営ログイン（従来方式・「運営」専用） -->
    <div id="adminForm">
      <input type="password" id="accessKey" placeholder="アクセスキー（8桁）">
      <button onclick="login()">ログイン</button>
      <p id="msg"></p>
    </div>
  </main>

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
// ▼Google Cloud Consoleで発行したOAuthクライアントIDに書き換えてください
const GOOGLE_CLIENT_ID = "63849227908-th525fl0grpko8l0m78m98rbp03fnni7.apps.googleusercontent.com";
// ▼accounts_gas.gs をデプロイしたURLに書き換えてください
const ACCOUNTS_URL = "https://script.google.com/macros/s/AKfycbzwk-HQDX1CzntauLlQQxstoTkrfjrnfu8yhzjyei-qZbK8JDWppRtHk-SS87QfO8gm/exec";

const GAS_LOG_URL = "https://script.google.com/macros/s/AKfycbwDjgFbOxG6K22TdgbVZ1FJvEtpjZPAI1KArnvLgitFH3lS7yGb_JaQ-LpcgaFTiac7/exec";
const VALID_KEYS = ["00002025"];

let pendingIdToken = null;

window.onload = function () {
  if (window.google && google.accounts) {
    google.accounts.id.initialize({
      client_id: GOOGLE_CLIENT_ID,
      callback: handleGoogleLogin
    });
    google.accounts.id.renderButton(
      document.getElementById("googleSignInDiv"),
      { theme: "outline", size: "large", width: 280 }
    );
  }
};

async function handleGoogleLogin(response) {
  const googleMsg = document.getElementById("googleMsg");
  googleMsg.style.color = "#666";
  googleMsg.textContent = "確認中...";

  pendingIdToken = response.credential;

  try {
    const res = await fetch(ACCOUNTS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "lookup", idToken: pendingIdToken })
    });
    const data = await res.json();

    if (data.result !== "success") {
      googleMsg.style.color = "red";
      googleMsg.textContent = "確認に失敗しました: " + (data.message || "");
      return;
    }

    if (data.linked) {
      // 既に紐付け済み → そのユーザー名でログイン完了
      finishLogin(data.username);
    } else {
      // 初回：既存のユーザー名との紐付けを求める
      document.getElementById("googleLoginArea").style.display = "none";
      document.getElementById("linkForm").style.display = "block";
    }
  } catch (e) {
    googleMsg.style.color = "red";
    googleMsg.textContent = "通信エラーが発生しました。";
    console.error(e);
  }
}

async function submitLink() {
  const usernameInput = document.getElementById("linkUsername").value.trim();
  const linkMsg = document.getElementById("linkMsg");

  if (!usernameInput) {
    linkMsg.style.color = "red";
    linkMsg.textContent = "ユーザー名を入力してください。";
    return;
  }
  if (!pendingIdToken) {
    linkMsg.style.color = "red";
    linkMsg.textContent = "Googleログインをやり直してください。";
    return;
  }

  linkMsg.style.color = "#666";
  linkMsg.textContent = "登録中...";

  try {
    const res = await fetch(ACCOUNTS_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "link", idToken: pendingIdToken, username: usernameInput })
    });
    const data = await res.json();

    if (data.result !== "success") {
      linkMsg.style.color = "red";
      linkMsg.textContent = "登録に失敗しました: " + (data.message || "");
      return;
    }

    finishLogin(data.username);
  } catch (e) {
    linkMsg.style.color = "red";
    linkMsg.textContent = "通信エラーが発生しました。";
    console.error(e);
  }
}

function finishLogin(usernameValue) {
  localStorage.setItem("username", usernameValue);
  localStorage.setItem("accessKey", VALID_KEYS[0]); // 既存機能との互換のため設定
  localStorage.setItem("loginVersion", "2");

  fetch(GAS_LOG_URL, {
    method: "POST",
    body: JSON.stringify({ action: "login", username: usernameValue, details: "Googleログイン成功" }),
  }).catch(() => {});

  const googleMsg = document.getElementById("googleMsg");
  const linkMsg = document.getElementById("linkMsg");
  if (googleMsg) { googleMsg.style.color = "green"; googleMsg.textContent = `ログイン成功！（${usernameValue}）`; }
  if (linkMsg) { linkMsg.style.color = "green"; linkMsg.textContent = `ログイン成功！（${usernameValue}）`; }

  setTimeout(() => window.location.href = "index.html", 800);
}

function toggleAdminForm() {
  const form = document.getElementById("adminForm");
  form.style.display = form.style.display === "block" ? "none" : "block";
}

// ===== 運営ログイン（従来方式） =====
function login() {
  const username = "運営"; // このフォームは運営専用（ユーザー名を自由に打てないようにしている）
  const key = document.getElementById("accessKey").value.trim();
  const msg = document.getElementById("msg");

  if (!key) {
    msg.textContent = "アクセスキーを入力してください。";
    msg.style.color = "red";
    return;
  }

  if (VALID_KEYS.includes(key)) {
    localStorage.setItem("username", username);
    localStorage.setItem("accessKey", key);
    localStorage.setItem("loginVersion", "2");

    fetch(GAS_LOG_URL, {
      method: "POST",
      body: JSON.stringify({
        action: "login",
        username: username,
        details: "運営ログイン成功"
      }),
    }).catch(() => {});

    msg.style.color = "green";
    msg.textContent = "ログイン成功！";
    setTimeout(() => window.location.href = "index.html", 800);
  } else {
    msg.textContent = "アクセスキーが間違っています。";
    msg.style.color = "red";
  }
}
  </script>

</body>
</html>
