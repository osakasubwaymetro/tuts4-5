<!DOCTYPE html>
<html lang="ja">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新規投稿</title>
  <!-- version: 1.11.2 -->
  <!-- 1.11.2: ポップアップ（履歴選択・スタンプ帳）をEscキーでも閉じられるように対応 -->
  <!-- 1.11.1: メモ欄・ユーザー名表示欄にautocomplete="off"を追加。ブラウザのオートフィルが
             メモ欄にユーザー名等の無関係な値を提案・自動入力してしまう可能性への対策 -->
  <!-- 1.11.0: 過去の乗車記録ポップアップにショートカット合流＋手入力オプションを追加するための
             スタイル（edit-field-label, save-btn, cancel-btn 等）を追加 -->
  <!-- 1.10.2: 編成グループ絞り込みプルダウンの幅がSafariで無視される問題を修正
             （appearance:menulistがネイティブ矢印を強制し幅指定を無視していたのが原因。
             appearance:noneのカスタム矢印方式に変更） -->
  <!-- 1.10.1: 編成グループの絞り込みプルダウンが潰れて見える不具合を修正 -->
  <!-- 1.10.0: 車両形式プルダウンもアイコン付きポップアップ選択方式に変更。
             全ページにキャッシュ対策（no-cacheメタタグ、共有JSのバージョンクエリ）を追加 -->
  <!-- 1.9.0: 車番プルダウンを、選んだ形式の全編成をアイコン画像＋編成番号で一覧表示する
             ポップアップ選択方式に変更 -->
  <!-- 1.8.1: 車両検索の結果カードに編成アイコン画像を表示するためのスタイルを追加 -->
  <!-- 1.8.0: 車番プルダウンの右下に「🔍 車両検索」ボタンを追加。numberシートの「各号車」列を
             使って、入力した車番を含む編成を今の路線の車両形式に絞って一覧表示できるように -->
  <!-- 1.7.7: 車両形式のみ選択・車番未選択で投稿した場合、編成全体（車番問わず）の乗車回数を
             表示するように対応。車両形式が無い投稿は、スタンプ帳を出さずそのまま降車ポップアップの
             確認へ進むように修正（今まで早期returnで確認自体が止まっていた） -->
  <!-- 1.7.6: 「運営」アカウントでは、乗車列車を選択ボタンを押すと現在地の代わりに
             エリア〜駅名を手動で選べるテスト用ピッカーが開くように対応 -->
  <!-- 1.7.5: 降車駅ポップアップに複数路線をまたぐ直通乗り継ぎ記録（🔀 別路線に直通する）を追加 -->
  <!-- 1.7.4: ポップアップを背景タップでは閉じないように変更（✕ボタンのみで閉じる） -->
  <!-- 1.7.3: ?checkDescent=1（過去一括チェック）の処理を撤去 -->
  <!-- 1.7.2: 降車駅ポップアップに詳細情報カードのスタイルを追加 -->
  <!-- 1.7.1: ?checkDescent=1で過去の未回答降車駅チェックを起動できるように対応 -->
  <!-- 1.7.0: クリアボタンを追加。?openDescent=1でヘッダーからの降車ポップアップ起動に対応 -->
  <!-- 1.6.0: スタンプポップアップを閉じた後、前回の乗車の降車駅を聞くポップアップに繋がるフックを追加 -->
  <!-- 1.5.2: 「乗車列車を選択」ボタン押下時に即ポップアップを開いて「確認中」を表示するように変更 -->
  <!-- 1.5.1: 近くの駅選択もポップアップに統合。change イベントのバブリング不具合を修正 -->
  <!-- 1.5.0: 「方面」プルダウンを廃止。乗車駅選択→ポップアップ（方面→過去の乗車記録）の流れに変更 -->
  <!-- 1.4.3: 過去の乗車記録ダイアログを、スタンプポップアップと統一感のある中央ポップアップ表示に変更 -->
  <!-- 1.4.2: ボタン名を「乗車列車を選択」に変更。過去の乗車記録の選択を上から出るダイアログに変更 -->
  <!-- 1.4.1: 「方面」ブロックをショートカット・乗車駅選択より上に移動 -->
  <!-- 1.4.0: 「方面」ピッカー（過去の乗車記録から種別・行先を提案）を追加 -->
  <!-- 1.3.0: 「現在地から駅を探す」ボタンを廃止し、「現在時刻を入力」ボタンに統合 -->
  <!-- 1.2.0: 「現在地から駅を探す」ボタンを追加（近くの駅・路線候補から自動入力） -->
  <!-- 1.1.0: フォームを「まとまり」単位でグループ化し、併結（複数種別・行先）に対応 -->
  <style>
    body {
      font-family: "Hiragino Sans", "Segoe UI", sans-serif;
      background-color: #F7F8FA;
      margin: 0;
      padding: 0;
      color: #222;
    }


  

    header {
      background-color: #004C97;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
    }

    main {
      max-width: 600px;
      background: white;
      margin: 30px auto;
      padding: 20px 25px;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    h2 {
      text-align: center;
      color: #004C97;
      margin-bottom: 20px;
    }

    h3 {
      color: #004C97;
      font-size: 16px;
      margin-top: 20px;
    }

    input, select, button {
      width: 100%;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      background-color: #004C97;
      color: white;
      border: none;
      font-weight: bold;
      margin-top: 25px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background-color: #E60012;
    }

    small {
      font-size: 12px;
      color: #666;
    }

    /* ===== まとまりA：エリア・区分／会社・路線を横並びに ===== */
    .row-2 {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }
    .row-2 .field { flex: 1; min-width: 0; }
    .row-2 .field h3 { margin: 0 0 6px 0; }
    .row-2 .field select { width: 100%; }

    /* ===== まとまりB：乗車駅 → 種別／行先 ===== */
    #rideBlocks h3 { margin-top: 20px; margin-bottom: 8px; }

    .ride-block {
      background: #FAFBFD;
      border: 1.5px solid #E3E8F0;
      border-radius: 12px;
      padding: 14px;
      margin-top: 12px;
    }
    .ride-block-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .ride-block-label {
      font-size: 13px;
      font-weight: bold;
      color: #004C97;
    }
    .remove-couple-btn {
      width: auto;
      padding: 4px 12px;
      margin-top: 0;
      font-size: 12px;
      font-weight: normal;
      background: #f0f0f0;
      color: #888;
      border-radius: 20px;
    }
    .remove-couple-btn:hover { background: #E60012; color: white; }

    .ride-block-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ride-block-row .field { min-width: 0; }
    .ride-block-row .field select { width: 100%; }
    .station-field { flex: 0 0 36%; }
    .stack-field { flex: 1; display: flex; flex-direction: column; gap: 6px; }
    .arrow {
      flex-shrink: 0;
      font-size: 20px;
      font-weight: bold;
      color: #004C97;
      padding-top: 18px;
    }
    .mini-label {
      display: block;
      font-size: 12px;
      color: #666;
      margin-bottom: 2px;
    }

    #coupleBtn {
      background: white;
      color: #004C97;
      border: 1.5px dashed #96b6dd;
      font-weight: bold;
      margin-top: 12px;
    }
    #coupleBtn:hover { background: #EEF4FF; color: #004C97; }

    @media (max-width: 380px) {
      .ride-block-row { flex-wrap: wrap; }
      .station-field { flex: 1 1 100%; }
      .arrow { display: none; }
      .stack-field { flex: 1 1 100%; }
    }

    /* ===== LOADING POPUP ===== */
    .loading-popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 10001;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
    }
    .loading-popup-overlay.show { display: flex; }
    .loading-popup {
      background: white;
      border-radius: 20px;
      padding: 36px 40px;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.2);
      animation: popupIn 0.3s ease both;
    }
    .loading-train {
      font-size: 48px;
      display: block;
      margin-bottom: 12px;
      animation: trainRun 0.8s ease-in-out infinite alternate;
    }
    @keyframes trainRun {
      from { transform: translateX(-8px); }
      to   { transform: translateX(8px); }
    }
    .loading-track {
      width: 120px;
      height: 4px;
      background: #eee;
      border-radius: 2px;
      margin: 0 auto 16px;
      overflow: hidden;
      position: relative;
    }
    .loading-track::after {
      content: '';
      position: absolute;
      left: -40%;
      width: 40%;
      height: 100%;
      background: #004C97;
      border-radius: 2px;
      animation: trackSlide 0.8s ease-in-out infinite;
    }
    @keyframes trackSlide {
      from { left: -40%; }
      to   { left: 100%; }
    }
    .loading-text {
      font-size: 14px;
      color: #555;
      font-family: "Hiragino Sans", sans-serif;
    }

    /* ===== STAMP POPUP ===== */
    .stamp-popup-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
    }
    .stamp-popup-overlay.show {
      display: flex;
    }
    .stamp-popup {
      background: #FAF6EF;
      border-radius: 20px;
      padding: 32px 28px 24px;
      max-width: 360px;
      width: 90%;
      text-align: center;
      box-shadow: 0 16px 48px rgba(0,0,0,0.25);
      animation: popupIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      position: relative;
      font-family: "Hiragino Sans", "Segoe UI", sans-serif;
    }
    @keyframes popupIn {
      from { transform: scale(0.7) translateY(40px); opacity: 0; }
      to   { transform: scale(1) translateY(0); opacity: 1; }
    }
    .stamp-popup-label {
      font-size: 13px;
      color: #999;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .stamp-popup-model {
      font-size: 22px;
      font-weight: bold;
      color: #004C97;
      margin-bottom: 20px;
    }
    .stamp-popup-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-bottom: 20px;
      max-height: 320px;
      overflow-y: auto;
      padding: 4px;
    }
    .stamp-popup-cell {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .stamp-popup-cell .sp-label {
      font-size: 11px;
      color: #555;
    }
    .stamp-popup-cell.highlight .sp-label {
      color: #004C97;
      font-weight: bold;
    }
    .stamp-popup-cell.highlight .sp-circle {
      animation: stampBounce 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 0.2s both;
    }
    @keyframes stampBounce {
      from { transform: scale(0) rotate(-20deg); opacity: 0; }
      to   { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .stamp-popup-btn {
      background: #004C97;
      color: white;
      border: none;
      padding: 10px 32px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.2s;
    }
    .stamp-popup-btn:hover { background: #E60012; }
    .stamp-popup-msg {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    .stamp-popup-msg.first { color: #E60012; }
    .stamp-popup-msg.again { color: #004C97; }

    /* ショートカット */
    .shortcut-bar {
      background: linear-gradient(135deg, #EEF4FF, #f0f8ff);
      border: 1.5px solid #c5d8f5;
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 18px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .shortcut-bar label {
      font-size: 13px;
      font-weight: bold;
      color: #004C97;
      white-space: nowrap;
    }
    .shortcut-bar select {
      flex: 1;
      padding: 7px 10px;
      border: 1.5px solid #c5d8f5;
      border-radius: 7px;
      font-size: 13px;
      background: white;
    }
    .shortcut-bar a {
      font-size: 12px;
      color: #888;
      text-decoration: none;
      white-space: nowrap;
    }
    .shortcut-bar a:hover { color: #004C97; }

    .notice-card {
      background: #ffffff;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      max-width: 600px;
    }

    .notice-title {
      text-align: left;
      color: #007bff;
      font-size: 20px;
      margin: 0 0 10px 0;
      font-weight: 600;
    }

    .notice-text {
      margin: 0;
      color: #333;
      font-size: 16px;
    }

    /* ===== 現在地から駅を探す（結果表示エリア。実際の選択はポップアップ内で行う） ===== */
    #geoStationResult {
      margin-top: 10px;
      font-size: 13px;
      color: #333;
    }

    /* ===== 過去の乗車記録から選ぶ：スタンプポップアップと統一した中央ポップアップ ===== */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(3px);
    }
    .modal-overlay.show { display: flex; }
    .modal-panel {
      background: #FAF6EF;
      border-radius: 20px;
      padding: 24px 20px 20px;
      max-width: 360px;
      width: 90%;
      max-height: 80vh;
      box-shadow: 0 16px 48px rgba(0,0,0,0.25);
      animation: popupIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1) both;
      font-family: "Hiragino Sans", "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      color: #004C97;
      font-weight: bold;
      font-size: 15px;
    }
    .modal-close {
      width: auto;
      background: none;
      color: #999;
      font-size: 18px;
      padding: 2px 6px;
      margin-top: 0;
    }
    .modal-close:hover { color: #E60012; background: none; }
    .modal-list {
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 2px;
    }
    .modal-list button {
      width: 100%;
      text-align: left;
      background: white;
      color: #333;
      border: 1.5px solid #E3E8F0;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 15px;
      margin-top: 0;
    }
    .modal-list button:hover, .modal-list button:active {
      background: #EEF4FF;
      color: #004C97;
      border-color: #004C97;
    }
    .modal-loading {
      color: #888;
      font-size: 14px;
      text-align: center;
      padding: 20px 10px;
      margin: 0;
    }
    .descent-ride-summary {
      background: #EEF4FF;
      border: 1.5px solid #cfe0f2;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      line-height: 1.6;
      color: #17324f;
      margin-bottom: 10px;
    }
    .secondary-btn {
      background: #EEF4FF;
      color: #004C97;
      border: none;
      border-radius: 8px;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
    }
    .secondary-btn:hover { background: #d9e6fb; }
    .formation-filter-select {
      display: block;
      width: 100%;
      height: 42px;
      line-height: 1.4;
      padding: 8px 32px 8px 12px;
      border-radius: 8px;
      border: 1px solid #ccc;
      background-color: #fff;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23666'><path d='M7 10l5 5 5-5z'/></svg>");
      background-repeat: no-repeat;
      background-position: right 10px center;
      background-size: 18px;
      font-size: 14px;
      margin-bottom: 12px;
      box-sizing: border-box;
      -webkit-appearance: none;
      appearance: none;
    }
    .number-trigger-btn {
      display: block;
      width: 100%;
      text-align: left;
      background: #fff;
      color: #222;
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 10px 12px;
      font-size: 14px;
      cursor: pointer;
      box-sizing: border-box;
    }
    .number-trigger-btn.placeholder { color: #999; }
    .number-trigger-btn:hover, .number-trigger-btn:active { border-color: #004C97; }
    .car-search-result {
      background: #fff;
      border: 1.5px solid #E3E8F0;
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 10px;
      cursor: pointer;
    }
    .car-search-result:hover, .car-search-result:active {
      border-color: #004C97;
      background: #EEF4FF;
    }
    .csr-header {
      display: flex;
      justify-content: space-between;
      font-size: 13px;
      color: #666;
      margin-bottom: 6px;
    }
    .csr-main {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .csr-icon {
      width: 56px;
      height: 56px;
      object-fit: contain;
      border-radius: 8px;
      background: #f7f7f7;
      flex-shrink: 0;
    }
    .csr-info { flex: 1; min-width: 0; }
    .csr-number { font-weight: bold; color: #004C97; }
    .csr-cars {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .csr-car {
      background: #f2f2f2;
      color: #444;
      border-radius: 6px;
      padding: 3px 8px;
      font-size: 12px;
    }
    .csr-car.highlight {
      background: #FFF3CD;
      color: #7a5b00;
      font-weight: bold;
    }
    .descent-breadcrumb {
      background: #FFF7E6;
      border: 1.5px solid #f0dca0;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: bold;
      color: #7a5b00;
      margin-bottom: 10px;
    }
    .descent-transfer-btn {
      background: #FFF7E6 !important;
      color: #7a5b00 !important;
      border-color: #f0dca0 !important;
      font-weight: bold;
    }
    .descent-back-btn {
      background: #f2f2f2 !important;
      color: #888 !important;
    }
    .edit-field-label {
      display: block;
      font-size: 12px;
      color: #888;
      margin: 10px 0 3px;
    }
    #historyModalList input[type="text"],
    #historyModalList input[type="datetime-local"],
    #historyModalList select {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1.5px solid #E3E8F0;
      font-size: 14px;
      box-sizing: border-box;
    }
    .save-btn, .cancel-btn {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      cursor: pointer;
      margin-right: 8px;
    }
    .save-btn { background: #004C97; color: white; }
    .cancel-btn { background: #eee; color: #666; }
  </style>
</head>
<body>

<!-- 方面選択・過去の乗車記録から選ぶダイアログ（乗車駅を選ぶと自動で開く） -->
<div id="historyModalOverlay" class="modal-overlay">
  <div class="modal-panel" onclick="event.stopPropagation()">
    <div class="modal-header">
      <span id="modalTitle">方面を選択</span>
      <button type="button" class="modal-close" onclick="closeHistoryModal()">✕</button>
    </div>
    <div id="historyModalList" class="modal-list"></div>
  </div>
</div>



<main>
  <div style="display:flex; justify-content:space-between; align-items:center;">
    <h2 style="margin:0;">投稿フォーム</h2>
    <button type="button" id="clearFormBtn" onclick="if(confirm('入力内容をクリアします。よろしいですか？')) resetForm();" style="width:auto; margin-top:0; padding:6px 14px; font-size:13px; background:#f2f2f2; color:#666;">🗑 クリア</button>

  <label><h3>発車時刻</h3></label>

  <!-- ショートカット選択 -->
  <div class="shortcut-bar">
    <label>⚡ ショートカット</label>
    <select id="shortcutSelect" onchange="applyShortcut()">

    <div class="field">
      <h3>区分</h3>
      <select id="type"></select>

  <div class="row-2">
    <div class="field">
      <h3>会社</h3>
      <select id="country"></select>

    <div class="field">
      <h3>路線</h3>
      <select id="route"></select>

  <div id="rideBlocks">

        <div class="field stack-field">
          <label class="mini-label">種別</label>
          <select class="sujitype-select"><option value="">選択してください</option></select>
          <label class="mini-label">行先</label>
          <select class="bound-select"><option value="">選択してください</option></select>

  </div>
  <button type="button" id="coupleBtn" onclick="addCoupling()" style="display:none;">🔗 併結を追加</button>

  <label><h3>車両形式</h3></label>
  <select id="model" style="display:none;"></select>
  <button type="button" id="modelTriggerBtn" class="number-trigger-btn placeholder" onclick="openModelPicker()">選択してください</button>

  <label><h3>車番</h3></label>
  <select id="number" style="display:none;"></select>
  <button type="button" id="numberTriggerBtn" class="number-trigger-btn placeholder" onclick="openFormationPicker()">選択してください</button>
  <div style="text-align:right; margin-top:6px;">
    <button type="button" id="carSearchBtn" class="secondary-btn" onclick="openCarSearchPopup()">🔍 車両検索</button>
  </div>

  <label><h3>メモ</h3></label>
  <small>プルダウンにない場合はここに入力してください</small>
  <input type="text" id="memo" name="ride_memo_note" autocomplete="off">

  <div class="notice-card">
    <h2 class="notice-title">お知らせ</h2>

  <button onclick="upload()">🚆 投稿する</button>

</div>

<div class="stamp-popup-overlay" id="stampPopupOverlay">
  <div class="stamp-popup">
    <div class="stamp-popup-label">投稿完了 🚆</div>
    <div class="stamp-popup-model" id="spModelName"></div>
    <div class="stamp-popup-msg" id="spMsg"></div>
    <div class="stamp-popup-grid" id="spGrid"></div>
    <button class="stamp-popup-btn" onclick="closeStampPopup()">とじる</button>
  </div>
</div>

<script src="nav.js?v=1.5.0"></script>
<script>initNav("新規投稿");</script>
<script>
  const _urlParams = new URLSearchParams(location.search);
  if (_urlParams.get("openDescent") === "1") {
    window.addEventListener("load", () => {
      setTimeout(() => {
        if (typeof maybeAskDescentStation === "function") maybeAskDescentStation();
      }, 900);
    });
  }
</script>
<script src="logs.js?v=1.2.1"></script>
<script src="scripts.js?v=1.24.4"></script>
<script>
  const username = checkLogin();

  // ===== ショートカット読み込み・適用 =====
  function loadShortcuts() {
    try { return JSON.parse(localStorage.getItem("tuts4_shortcuts") || "[]"); }
    catch { return []; }
  }

  function initShortcutSelect() {
    const sel = document.getElementById("shortcutSelect");
    const list = loadShortcuts();
    sel.innerHTML = '<option value="">⚡ 選択してください</option>';
    list.forEach((sc, i) => {
      const o = document.createElement("option");
      o.value = i;
      o.textContent = sc.name;
      sel.appendChild(o);
    });
  }

  // プルダウン選択後に各フィールドへ値を流し込む
  async function applyShortcut() {
    const idx = document.getElementById("shortcutSelect").value;
    if (idx === "") return;
    const sc = loadShortcuts()[parseInt(idx)];
    if (!sc) return;

    function setAndTrigger(id, val) {
      const el = document.getElementById(id);
      if (!el) return;
      el.value = val;
      el.dispatchEvent(new Event("change", { bubbles: true }));
    }

    function setAndTriggerFirst(selector, val) {
      const el = document.querySelector(selector);
      if (!el) return;
      el.value = val;
      el.dispatchEvent(new Event("change", { bubbles: true }));
    }

    // scripts.jsの連動プルダウンを順番にトリガー
    setAndTrigger("area", sc.area);
    setAndTrigger("type", sc.type);
    await wait(300);
    setAndTrigger("country", sc.company);
    await wait(300);
    setAndTrigger("route", sc.route);
    await wait(300);
    // ショートカットは1つ目の乗車ブロック（併結なし）に適用
    setAndTriggerFirst(".station-select",  sc.station);
    setAndTriggerFirst(".sujitype-select", sc.sujitype);
    setAndTriggerFirst(".bound-select",    sc.bound);

    // 選択をリセット（次回も使えるように）
    document.getElementById("shortcutSelect").value = "";
  }

  function wait(ms) { return new Promise(r => setTimeout(r, ms)); }

  // ページ読み込み時にショートカット一覧をセット
  initShortcutSelect();

  function showLoadingPopup() {
    document.getElementById("loadingPopupOverlay").classList.add("show");
  }
  function hideLoadingPopup() {
    document.getElementById("loadingPopupOverlay").classList.remove("show");
  }

  function closeStampPopup() {
    document.getElementById("stampPopupOverlay").classList.remove("show");
    if (typeof maybeAskDescentStation === "function") maybeAskDescentStation();
  }

  // Escキーでポップアップを閉じる
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape") return;
    const stampOverlay = document.getElementById("stampPopupOverlay");
    if (stampOverlay && stampOverlay.classList.contains("show")) {
      closeStampPopup();
      return;
    }
    const historyOverlay = document.getElementById("historyModalOverlay");
    if (historyOverlay && historyOverlay.classList.contains("show") && typeof closeHistoryModal === "function") {
      closeHistoryModal();
    }
  });

  // Close on overlay click
  document.getElementById("stampPopupOverlay").addEventListener("click", function(e) {
    if (e.target === this) closeStampPopup();
  });

  const NUMBER_URL = "https://opensheet.elk.sh/1ZooIjdlOwsLZVjQv6KN53h4X2JYUyULYuJTuhbgk95s/number";
  const RIDES_URL  = "https://script.google.com/macros/s/AKfycbyWTr6ejDZKkaw9owEM8yLcl6-6w5pHeyk2hWdX6Lw1INNg5ZxuhvCx7PPfOmxWHC17/exec";

  const STAMP_COLORS = [
    "#C0392B","#1a5276","#1e8449","#7d3c98","#b7950b","#784212"
  ];

  function stampSVGSmall(color, ridden) {
    if (!ridden) {
      return `<svg width="56" height="56" viewBox="0 0 56 56">
        <circle cx="28" cy="28" r="22" fill="none" stroke="#d0c8be" stroke-width="2" stroke-dasharray="5 3"/>
      </svg>`;
    }
    return `<svg width="56" height="56" viewBox="0 0 80 80" xmlns="http://www.w3.org/2000/svg">
      <circle cx="40" cy="40" r="36" fill="none" stroke="${color}" stroke-width="4" opacity="0.9"/>
      <circle cx="40" cy="40" r="29" fill="none" stroke="${color}" stroke-width="1.5" opacity="0.7"/>
      <circle cx="40" cy="40" r="27" fill="${color}" opacity="0.12"/>
      <text x="40" y="47" text-anchor="middle" font-family="serif" font-size="22" fill="${color}" font-weight="700" opacity="0.9">乗</text>
    </svg>`;
  }

  async function showStampPopup(modelValue, postedNumber) {
    if (!modelValue) {
      // 車両形式が無ければスタンプ帳は出さず、そのまま降車ポップアップの確認へ進む
      if (typeof maybeAskDescentStation === "function") maybeAskDescentStation();
      return;
    }

    const [numberData, rideData] = await Promise.all([
      fetch(NUMBER_URL).then(r => r.json()),
      fetch(RIDES_URL).then(r => r.json())
    ]);

    // All formations for this model (exclude ***)
    const formations = numberData
      .filter(r => r["車両形式"] === modelValue && !String(r["車番"] || "").includes("*"))
      .map(r => r["車番"]);

    // My rides for this model (including the just-posted one)
    const myRides = rideData.filter(r =>
      r["ユーザー名"] === username && r["車両形式"] === modelValue
    );

    // Get color index based on model order in full number data
    const allModels = [...new Set(numberData.map(r => r["車両形式"]))];
    const colorIdx = allModels.indexOf(modelValue) % STAMP_COLORS.length;
    const color = STAMP_COLORS[colorIdx];

    document.getElementById("spModelName").textContent = modelValue;
    const grid = document.getElementById("spGrid");
    grid.innerHTML = "";

    if (!postedNumber) {
      // 車番が未選択：編成全体（車番問わず）での乗車回数を表示する
      const totalCount = myRides.length + 1; // 今回の分も含める
      const riddenSet = new Set(myRides.map(r => r["車番"]).filter(Boolean));

      document.getElementById("spMsg").textContent = `🚆 ${modelValue} 全体の乗車回数：${totalCount} 回`;
      document.getElementById("spMsg").className = "stamp-popup-msg again";

      formations.forEach(num => {
        const isRidden = riddenSet.has(num);
        const cell = document.createElement("div");
        cell.className = "stamp-popup-cell";
        cell.innerHTML = `
          <div class="sp-circle">${stampSVGSmall(color, isRidden)}</div>
          <div class="sp-label">${num}</div>
        `;
        grid.appendChild(cell);
      });

      document.getElementById("stampPopupOverlay").classList.add("show");
      return;
    }

    const riddenSet = new Set(myRides.map(r => r["車番"]));
    // Also count the just-posted one as ridden
    riddenSet.add(postedNumber);

    // Check if first time riding this number
    const prevRides = myRides.filter(r => r["車番"] === postedNumber);
    const isFirst = prevRides.length === 0;

    document.getElementById("spMsg").textContent = isFirst
      ? `🎉 ${postedNumber} は初乗車！`
      : `🚆 ${postedNumber}編成の乗車回数：${prevRides.length} 回`;
    document.getElementById("spMsg").className = "stamp-popup-msg " + (isFirst ? "first" : "again");

    formations.forEach(num => {
      const isRidden = riddenSet.has(num);
      const isNew = num === postedNumber;
      const cell = document.createElement("div");
      cell.className = "stamp-popup-cell" + (isNew ? " highlight" : "");
      cell.innerHTML = `
        <div class="sp-circle">${stampSVGSmall(color, isRidden)}</div>
        <div class="sp-label">${num}</div>
      `;
      grid.appendChild(cell);
    });

    document.getElementById("stampPopupOverlay").classList.add("show");
  }

  function setCurrentDateTime() {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = String(now.getDate()).padStart(2, "0");
    const hours = String(now.getHours()).padStart(2, "0");
    const minutes = String(now.getMinutes()).padStart(2, "0");
    const localDatetime = `${year}-${month}-${day}T${hours}:${minutes}`;

    document.getElementById("departing_time").value = localDatetime;
    locateAndFill();
  }

  // 「現在時刻を入力」を押したときに、位置情報を1回だけ取得して
  // ① エリア推定 と ② 最寄り駅検索（scripts.js） をまとめて行う
  function locateAndFill() {
    // 「運営」アカウントの場合は、現在地に頼らずエリア〜駅名を手動で選んでテストできるようにする
    if (localStorage.getItem("username") === "運営") {
      if (typeof openAdminStationPicker === "function") openAdminStationPicker();
      return;
    }

    const areaSelect = document.getElementById("area");
    const resultBox = document.getElementById("geoStationResult");

    if (!navigator.geolocation) return;
    if (resultBox) resultBox.textContent = "";

    // ボタンを押した瞬間にポップアップを開いて「確認中」を表示する
    if (typeof openModalLoading === "function") {
      openModalLoading("近くの駅を選択", "📍 現在地を確認中...");
    }

    navigator.geolocation.getCurrentPosition(async pos => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      // ① エリア推定（都道府県→地方）
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&accept-language=ja`);
        const data = await res.json();
        const address = data.address;
        const pref = address.state || address.region || address.province || "";

        const regionMap = {
          "北海道": "北海道",
          "青森県": "東北", "岩手県": "東北", "宮城県": "東北", "秋田県": "東北", "山形県": "東北", "福島県": "東北",
          "茨城県": "関東", "栃木県": "関東", "群馬県": "関東", "埼玉県": "関東", "千葉県": "関東", "東京都": "関東", "神奈川県": "関東",
          "新潟県": "北陸", "富山県": "北陸", "石川県": "北陸", "福井県": "北陸",
          "山梨県": "東海", "長野県": "東海", "岐阜県": "東海", "静岡県": "東海", "愛知県": "東海",
          "三重県": "関西", "滋賀県": "関西", "京都府": "関西", "大阪府": "関西", "兵庫県": "関西", "奈良県": "関西", "和歌山県": "関西",
          "鳥取県": "中国", "島根県": "中国", "岡山県": "中国", "広島県": "中国", "山口県": "中国",
          "徳島県": "四国", "香川県": "四国", "愛媛県": "四国", "高知県": "四国",
          "福岡県": "九州", "佐賀県": "九州", "長崎県": "九州", "熊本県": "九州", "大分県": "九州", "宮崎県": "九州", "鹿児島県": "九州", "沖縄県": "九州"
        };

        const selectedArea = regionMap[pref] || "";
        if (selectedArea) {
          areaSelect.value = selectedArea;
          areaSelect.dispatchEvent(new Event("change", { bubbles: true }));
        }
      } catch (e) {
        console.error("逆ジオコーディング失敗:", e);
      }

      // ② 最寄り駅検索（scripts.js 側の関数。開いているポップアップの中身を更新する）
      if (typeof findNearbyStationsFromPosition === "function") {
        findNearbyStationsFromPosition(lat, lon);
      }
    }, err => {
      console.error("位置情報エラー:", err);
      const list = document.getElementById("historyModalList");
      if (list) list.innerHTML = '<p class="modal-loading">位置情報を取得できませんでした。端末の位置情報設定を確認してください。</p>';
      if (resultBox) resultBox.textContent = "位置情報を取得できませんでした。端末の位置情報設定を確認してください。";
    });
  }
</script>

</body>
