<!-- version: 1.4.1 -->
<!-- 1.4.1: ドットと線の間に隙間が出る問題を修正。連結用の別パーツを使うのをやめ、
           各駅の行自体が上半分・下半分の線を内蔵して隙間なく繋がる方式に変更 -->
<!-- 1.3.0: ①via_の枝分かれ表示を、via_が拠点駅より前にあるか後ろにあるかで上側／下側に
           振り分けるように変更（例: 大阪方面からの直通は淡路の上側に出るように）。
           ②マスタデータの背景更新でプルダウンの選択がリセットされないよう、
           全レベルを一括で再構築・値を保持する方式に統一 -->
<!-- 1.2.0: via_の隣接駅の判定を「後方優先の決め打ち」から「直通先路線の駅リストにも
           実在する方を優先」する方式に変更。via_が2つの実駅にちょうど挟まれている場合でも
           正しい拠点駅を選べるように（例: 阪急京都線↔千里線の淡路） -->
<!-- 1.1.0: 直通先の表示を、列車走行位置マップ風の「路線端なら直線で下に継続」「途中駅なら
           曲線で枝分かれ」というスタイルに変更。編成アイコンは無し。路線ごとに色を自動で決める -->
<!-- 1.0.0: 初版 -->

<body>

<main>
  <h2>🗺 乗車路線マップ確認用</h2>
  <p class="small">エリア〜路線を選ぶと、その路線の乗車区間マップが見れます。直通先の拠点駅にはピクトグラムが出るので、タップするとその路線に切り替わります。（自分のローカルに保存されている乗車・降車データを使って計算しています）</p>

  <div class="select-card">
    <label>エリア</label>
    <select id="mapArea"><option value="">選択してください</option></select>
    <label>区分</label>
    <select id="mapType"><option value="">選択してください</option></select>
    <label>会社</label>
    <select id="mapCompany"><option value="">選択してください</option></select>
    <label>路線</label>
    <select id="mapRoute"><option value="">選択してください</option></select>
  </div>

  <div id="mapResult"></div>
</main>

<script src="nav.js?v=1.5.1"></script>
<script src="logs.js?v=1.2.1"></script>

<script>
const username = checkLogin();

document.addEventListener("DOMContentLoaded", () => {
  logAction("view", "ページ閲覧: linemap.html");
});

/* ----------------------------------------
   マスタデータ（他ページと共通のキャッシュキーを使い回す）
---------------------------------------- */
let allAreaData = [], allTypeData = [], allCountryData = [], allrouteData = [], allstationData = [];
const BASE = "https://opensheet.elk.sh/1ZooIjdlOwsLZVjQv6KN53h4X2JYUyULYuJTuhbgk95s/";

function fetchCachedMasterData(cacheKey, url, handler) {
  const key = "tuts4_master_" + cacheKey;
  try {
    const cached = localStorage.getItem(key);
    if (cached) handler(JSON.parse(cached));
  } catch (e) { /* 壊れたキャッシュは無視 */ }

  fetchJsonArrayWithRetry(url).then(data => {
    if (!data) return;
    handler(data);
    try { localStorage.setItem(key, JSON.stringify(data)); } catch (e) { /* 容量超過等は無視 */ }
  });
}

async function fetchJsonArrayWithRetry(url, attempts = 2) {
  for (let i = 0; i < attempts; i++) {
    try {
      const res = await fetch(url);
      const data = await res.json();
      if (Array.isArray(data)) return data;
    } catch (e) { /* 下でリトライ */ }
    if (i < attempts - 1) await new Promise(r => setTimeout(r, 1000));
  }
  return null;
}

function rebuildAllSelects() {
  buildAreaSelect();
  buildTypeSelect();
  buildCompanySelect();
  buildRouteSelect();
  if (document.getElementById("mapRoute").value) renderMap();
}

fetchCachedMasterData("area", BASE + "area", data => { allAreaData = data; rebuildAllSelects(); });
fetchCachedMasterData("type", BASE + "type", data => { allTypeData = data; rebuildAllSelects(); });
fetchCachedMasterData("country", BASE + "country", data => { allCountryData = data; rebuildAllSelects(); });
fetchCachedMasterData("route", BASE + "route", data => { allrouteData = data; rebuildAllSelects(); });
fetchCachedMasterData("station", BASE + "station", data => {
  allstationData = data;
  if (document.getElementById("mapRoute").value) renderMap();
});

/* ----------------------------------------
   カスケード選択（エリア→区分→会社→路線）
---------------------------------------- */
function fillSelectPreserve(sel, options) {
  const cur = sel.value;
  sel.innerHTML = '<option value="">選択してください</option>' + options.map(v => `<option value="${v}">${v}</option>`).join("");
  if (options.includes(cur)) sel.value = cur;
}

function buildAreaSelect() {
  fillSelectPreserve(document.getElementById("mapArea"), [...new Set(allAreaData.map(r => r["えりあ"]))].filter(Boolean));
}
function buildTypeSelect() {
  fillSelectPreserve(document.getElementById("mapType"), [...new Set(allTypeData.map(r => r["区分"]))].filter(Boolean));
}
function buildCompanySelect() {
  const areaVal = document.getElementById("mapArea").value;
  const typeVal = document.getElementById("mapType").value;
  fillSelectPreserve(
    document.getElementById("mapCompany"),
    [...new Set(allCountryData.filter(r => r["えりあ"] === areaVal && r["区分"] === typeVal).map(r => r["会社"]))].filter(Boolean)
  );
}
function buildRouteSelect() {
  const typeVal = document.getElementById("mapType").value;
  const companyVal = document.getElementById("mapCompany").value;
  fillSelectPreserve(
    document.getElementById("mapRoute"),
    [...new Set(allrouteData.filter(r => r["区分"] === typeVal && r["会社"] === companyVal).map(r => r["路線"]))].filter(Boolean)
  );
}
function refreshCascade() {
  buildCompanySelect();
  buildRouteSelect();
}

document.getElementById("mapArea").addEventListener("change", () => { buildCompanySelect(); buildRouteSelect(); clearMap(); });
document.getElementById("mapType").addEventListener("change", () => { buildCompanySelect(); buildRouteSelect(); clearMap(); });
document.getElementById("mapCompany").addEventListener("change", () => { buildRouteSelect(); clearMap(); });
document.getElementById("mapRoute").addEventListener("change", renderMap);

function clearMap() {
  document.getElementById("mapResult").innerHTML = "";
}

// 選んだ路線から、区分・会社・エリアを逆算する（ピクトグラムから直通先に飛ぶ時に使う）
function findRouteMeta(routeName) {
  const routeRow = allrouteData.find(r => r["路線"] === routeName);
  if (!routeRow) return null;
  const type = routeRow["区分"];
  const company = routeRow["会社"];
  const countryRow = allCountryData.find(r => r["区分"] === type && r["会社"] === company);
  return { area: countryRow ? countryRow["えりあ"] : "", type, company, route: routeName };
}

function jumpToRoute(routeName) {
  const meta = findRouteMeta(routeName);
  if (!meta) {
    alert("この路線のマスタデータが見つかりませんでした: " + routeName);
    return;
  }
  document.getElementById("mapArea").value = meta.area;
  buildCompanySelect();
  buildRouteSelect();
  document.getElementById("mapType").value = meta.type;
  buildCompanySelect();
  buildRouteSelect();
  document.getElementById("mapCompany").value = meta.company;
  buildRouteSelect();
  document.getElementById("mapRoute").value = meta.route;
  renderMap();
}

/* ----------------------------------------
   via_（直通先）関連のヘルパー
---------------------------------------- */
function isViaEntry(n) { return typeof n === "string" && n.startsWith("via_"); }
function viaTargetRoute(n) { return n.slice(4).split("#")[0]; }

// 路線名から見た目の色を一定に決める（同じ路線なら常に同じ色になる）
const LINE_COLORS = ["#1e8449", "#2874a6", "#b9770e", "#7d3c98", "#c0392b", "#117864", "#5b2c6f", "#1a5276"];
function colorForRoute(name) {
  let hash = 0;
  const s = String(name || "");
  for (let i = 0; i < s.length; i++) hash = (hash * 31 + s.charCodeAt(i)) % LINE_COLORS.length;
  return LINE_COLORS[Math.abs(hash) % LINE_COLORS.length];
}
function escAttr(s) { return String(s).replace(/"/g, "&quot;"); }

// route シートの「路線カラー」列（#RRGGBB形式のテキスト）から、その路線の色を取得する。
// 無ければ既定の青を使う
function getRouteColor(routeName) {
  const row = allrouteData.find(r => r["路線"] === routeName);
  const hex = row && row["路線カラー"] ? String(row["路線カラー"]).trim() : "";
  return /^#[0-9a-fA-F]{6}$/.test(hex) ? hex : "#004C97";
}

// 色を白方向に混ぜて薄くする（amount: 0〜1、1に近いほど白に近づく）
function lightenColor(hex, amount) {
  const n = hex.replace("#", "");
  const r = parseInt(n.slice(0, 2), 16), g = parseInt(n.slice(2, 4), 16), b = parseInt(n.slice(4, 6), 16);
  const mix = c => Math.round(c + (255 - c) * amount);
  return `rgb(${mix(r)},${mix(g)},${mix(b)})`;
}

/* ----------------------------------------
   区間計算エンジン（statistick.htmlから移植）
---------------------------------------- */
function isCircularRouteName(routeName, routeMaster) {
  const row = routeMaster.find(r => r["路線"] === routeName);
  if (!row) return false;
  const v = row["環状"];
  return v === true || v === 1 || ["true", "TRUE", "1", "はい", "有", "✓"].includes(String(v).trim());
}
function isCircularReversedName(routeName, routeMaster) {
  const row = routeMaster.find(r => r["路線"] === routeName);
  if (!row) return false;
  const v = row["環状反転"];
  return v === true || v === 1 || ["true", "TRUE", "1", "はい", "有", "✓"].includes(String(v).trim());
}
function getCircularFixedDirectionName(routeName, routeMaster) {
  const row = routeMaster.find(r => r["路線"] === routeName);
  if (!row) return null;
  const v = String(row["環状方向限定"] || "").trim();
  if (v.includes("外回り")) return "外回り";
  if (v.includes("内回り")) return "内回り";
  return null;
}
function timeKeyMatch(a, b) {
  if (!a || !b) return false;
  if (String(a) === String(b)) return true;
  const da = new Date(a), db = new Date(b);
  return !isNaN(da) && !isNaN(db) && da.getTime() === db.getTime();
}
function parseDescentChain(raw) {
  let s = typeof raw === "string" ? raw : "";
  let circularDir = null;
  const m = s.match(/^\[環状:(外回り|内回り)\](.*)$/);
  if (m) { circularDir = m[1]; s = m[2]; }

  if (!s.includes("|") && !s.includes("@")) return { hops: [], finalStation: s, circularDir };
  const parts = s.split("|");
  const finalStation = parts.pop();
  const hops = parts.map(p => {
    const [junction, nextRoute] = p.split("@");
    return { junction, nextRoute };
  }).filter(h => h.junction && h.nextRoute);
  return { hops, finalStation, circularDir };
}
function buildLegs(boardingRoute, boardingStation, chain) {
  const legs = [];
  let currentRoute = boardingRoute;
  let currentBoard = boardingStation;
  chain.hops.forEach(hop => {
    legs.push({ route: currentRoute, board: currentBoard, alight: hop.junction });
    currentRoute = hop.nextRoute;
    currentBoard = hop.junction;
  });
  legs.push({ route: currentRoute, board: currentBoard, alight: chain.finalStation });
  return legs;
}
function getRouteStationInfo(routeName, stationData, cache) {
  if (cache[routeName]) return cache[routeName];
  const isVia = isViaEntry;
  const rawStationRows = stationData.filter(s => s["路線"] === routeName).map(s => s["駅名"]);
  const stationsOnRoute = rawStationRows.filter(name => !isVia(name));

  const rawIndexMap = {};
  rawStationRows.forEach((name, i) => { if (!(name in rawIndexMap)) rawIndexMap[name] = i; });

  const viaForward = {};
  const viaBackward = {};
  rawStationRows.forEach((name, rawIdx) => {
    if (!isVia(name)) return;
    for (let i = rawIdx - 1; i >= 0; i--) {
      if (!isVia(rawStationRows[i])) { viaBackward[name] = stationsOnRoute.indexOf(rawStationRows[i]); break; }
    }
    for (let i = rawIdx + 1; i < rawStationRows.length; i++) {
      if (!isVia(rawStationRows[i])) { viaForward[name] = stationsOnRoute.indexOf(rawStationRows[i]); break; }
    }
  });

  const info = { stationsOnRoute, rawIndexMap, viaForward, viaBackward };
  cache[routeName] = info;
  return info;
}
function resolveStationIndex(stationName, info, referenceStationName) {
  const idx = info.stationsOnRoute.indexOf(stationName);
  if (idx !== -1) return idx;

  const hasForward = Object.prototype.hasOwnProperty.call(info.viaForward, stationName);
  const hasBackward = Object.prototype.hasOwnProperty.call(info.viaBackward, stationName);
  if (!hasForward && !hasBackward) return -1;

  const viaRawIdx = info.rawIndexMap[stationName];
  const refRawIdx = referenceStationName ? info.rawIndexMap[referenceStationName] : undefined;

  if (refRawIdx !== undefined && viaRawIdx !== undefined) {
    if (refRawIdx > viaRawIdx && hasForward) return info.viaForward[stationName];
    if (refRawIdx < viaRawIdx && hasBackward) return info.viaBackward[stationName];
  }
  return hasBackward ? info.viaBackward[stationName] : info.viaForward[stationName];
}
function computeAllRiddenSegments(mine, myTransfers, stationData, routeMaster) {
  const stationInfoCache = {};
  const segmentsByRoute = {};

  mine.forEach(r => {
    if (!r.route) return;

    const matchedTransfer = myTransfers.find(t => timeKeyMatch(t["元の乗車時刻"], r.timeRaw));
    if (!matchedTransfer) return;

    const chain = parseDescentChain(String(matchedTransfer["降車駅"] || "").trim());
    if (!chain.finalStation) return;

    const legs = buildLegs(r.route, r.station, chain);

    legs.forEach((leg, legIdx) => {
      if (!leg.route) return;
      const info = getRouteStationInfo(leg.route, stationData, stationInfoCache);
      if (info.stationsOnRoute.length < 2) return;

      const boardIdx = resolveStationIndex(leg.board, info, leg.alight);
      const alightIdx = resolveStationIndex(leg.alight, info, leg.board);
      if (boardIdx === -1 || alightIdx === -1) return;

      if (!segmentsByRoute[leg.route]) segmentsByRoute[leg.route] = new Set();
      const total = info.stationsOnRoute.length;

      if (isCircularRouteName(leg.route, routeMaster)) {
        const forwardDist = (alightIdx - boardIdx + total) % total;
        const backwardDist = total - forwardDist;
        const fixedDir = getCircularFixedDirectionName(leg.route, routeMaster);
        const reversed = isCircularReversedName(leg.route, routeMaster);
        let goForward;
        if (fixedDir) {
          const wantsOuter = fixedDir === "外回り";
          goForward = reversed ? !wantsOuter : wantsOuter;
        } else if (legIdx === 0 && chain.circularDir) {
          const wantsOuter = chain.circularDir === "外回り";
          goForward = reversed ? !wantsOuter : wantsOuter;
        } else {
          goForward = forwardDist <= backwardDist;
        }
        if (goForward) {
          for (let i = 0; i < forwardDist; i++) segmentsByRoute[leg.route].add((boardIdx + i) % total);
        } else {
          for (let i = 0; i < backwardDist; i++) segmentsByRoute[leg.route].add((boardIdx - i - 1 + total) % total);
        }
      } else {
        const lo = Math.min(boardIdx, alightIdx);
        const hi = Math.max(boardIdx, alightIdx);
        for (let i = lo; i < hi; i++) segmentsByRoute[leg.route].add(i);
      }
    });
  });

  return { segmentsByRoute };
}

function readLocalCache(key) {
  try {
    const v = localStorage.getItem(key);
    return v ? JSON.parse(v) : [];
  } catch (e) { return []; }
}

/* ----------------------------------------
   メイン描画
---------------------------------------- */
function renderMap() {
  const routeVal = document.getElementById("mapRoute").value;
  const box = document.getElementById("mapResult");
  if (!routeVal) { box.innerHTML = ""; return; }
  if (!allstationData.length) { box.innerHTML = '<p class="small">駅データを読み込み中...</p>'; return; }

  const rawRows = allstationData.filter(r => r["路線"] === routeVal).map(r => r["駅名"]);
  const stationsOnRoute = rawRows.filter(n => !isViaEntry(n));
  if (stationsOnRoute.length < 2) {
    box.innerHTML = '<p class="small">この路線の駅データがありません（stationシートを確認してください）</p>';
    return;
  }

  // via_ → 隣接する実駅（拠点駅）でグループ化。路線の端にあるか（=直線continuation）、
  // 途中にあるか（=曲線の枝分かれ）も記録する。1つの駅に複数の直通先があってもOK
  //
  // 隣接候補（前方向・後方向）が両方ある場合は、「直通先の路線の駅リストにも実在する方」を
  // 優先して選ぶ（本当の乗換駅なら、接続先の路線にも同じ駅名が載っているはずなので）
  const stationToVias = {};
  rawRows.forEach((name, rawIdx) => {
    if (!isViaEntry(name)) return;
    const targetRoute = viaTargetRoute(name);

    let backward = null, backwardIdx = -1, forward = null, forwardIdx = -1;
    for (let i = rawIdx - 1; i >= 0; i--) { if (!isViaEntry(rawRows[i])) { backward = rawRows[i]; backwardIdx = i; break; } }
    for (let i = rawIdx + 1; i < rawRows.length; i++) { if (!isViaEntry(rawRows[i])) { forward = rawRows[i]; forwardIdx = i; break; } }

    let neighbor = null, neighborIdx = -1;
    if (backward && forward) {
      const targetStations = allstationData.filter(r => r["路線"] === targetRoute).map(r => r["駅名"]);
      if (targetStations.includes(backward) && !targetStations.includes(forward)) { neighbor = backward; neighborIdx = backwardIdx; }
      else if (targetStations.includes(forward) && !targetStations.includes(backward)) { neighbor = forward; neighborIdx = forwardIdx; }
      else { neighbor = backward; neighborIdx = backwardIdx; } // どちらも該当/非該当なら従来通り後方向を優先
    } else if (backward) {
      neighbor = backward; neighborIdx = backwardIdx;
    } else if (forward) {
      neighbor = forward; neighborIdx = forwardIdx;
    }
    if (!neighbor) return;

    const isEnd = (rawIdx === 0 || rawIdx === rawRows.length - 1);
    // via_が拠点駅より「前」にあるなら上側、「後ろ」にあるなら下側に枝分かれを描く
    const side = rawIdx < neighborIdx ? "above" : "below";
    if (!stationToVias[neighbor]) stationToVias[neighbor] = [];
    if (!stationToVias[neighbor].some(v => v.route === targetRoute)) {
      stationToVias[neighbor].push({ route: targetRoute, isEnd, side });
    }
  });

  // 自分のローカルキャッシュ（show.htmlが保存してるもの）から区間を計算する
  const cachedRides = readLocalCache("tuts4_show_cache_" + username);
  const cachedTransfers = readLocalCache("tuts4_transfers_cache_" + username);
  const mine = cachedRides.map(r => ({ route: r["路線"], station: r["乗車駅"], timeRaw: r["時刻"] }));
  const { segmentsByRoute } = computeAllRiddenSegments(mine, cachedTransfers, allstationData, allrouteData);
  const riddenSegments = segmentsByRoute[routeVal] || new Set();

  const isLoop = isCircularRouteName(routeVal, allrouteData);
  const totalSegments = isLoop ? stationsOnRoute.length : stationsOnRoute.length - 1;
  const riddenCount = riddenSegments.size;
  const pct = totalSegments > 0 ? Math.round((riddenCount / totalSegments) * 100) : 0;

  const mainColor = getRouteColor(routeVal);
  const riddenColor = mainColor;
  const unriddenColor = lightenColor(mainColor, 0.72);

  let html = `
    <div class="route-coverage-label">
      <span>${routeVal}</span>
      <span class="route-coverage-pct">${pct}%（${riddenCount}/${totalSegments}区間）</span>
    </div>
    <div class="route-line-scroll">
  `;

  function renderViaRow(vias, passColor) {
    let out = `<div class="pictogram-row"><div class="pictogram-passline" style="background:${passColor};"></div>`;
    vias.forEach(v => {
      const color = colorForRoute(v.route);
      if (v.isEnd) {
        const stubEl = `<div class="stub" style="background:${color};"></div>`;
        const pillEl = `<button type="button" class="via-pill" style="background:${color};" data-route="${escAttr(v.route)}">${v.route}</button>`;
        // 上側配置：ピル→スタブの順（スタブが下の駅へ繋がる）。下側配置：スタブ→ピルの順（従来通り）
        out += `
          <div class="via-branch-end">
            ${v.side === "above" ? pillEl + stubEl : stubEl + pillEl}
          </div>
        `;
      } else {
        // 上側配置は下から上に向かうカーブ、下側配置は上から下に向かうカーブにする
        const pathD = v.side === "above" ? "M2,20 Q2,4 26,4" : "M2,2 Q2,18 26,18";
        out += `
          <div class="via-branch-mid">
            <svg width="28" height="22" viewBox="0 0 28 22"><path d="${pathD}" stroke="${color}" stroke-width="3" fill="none"/></svg>
            <button type="button" class="via-pill" style="background:${color};" data-route="${escAttr(v.route)}">${v.route}</button>
          </div>
        `;
      }
    });
    return out + '</div>';
  }

  stationsOnRoute.forEach((name, i) => {
    const isFirst = i === 0;
    const isLast = i === stationsOnRoute.length - 1;

    let prevRidden = null;
    if (!isFirst) prevRidden = riddenSegments.has(i - 1);
    else if (isLoop) prevRidden = riddenSegments.has(totalSegments - 1);

    let nextRidden = null;
    if (!isLast) nextRidden = riddenSegments.has(i);
    else if (isLoop) nextRidden = riddenSegments.has(totalSegments - 1);

    const dotRidden = !!prevRidden || !!nextRidden;

    const vias = stationToVias[name] || [];
    const aboveVias = vias.filter(v => v.side === "above");
    const belowVias = vias.filter(v => v.side !== "above");

    if (aboveVias.length) html += renderViaRow(aboveVias, prevRidden ? riddenColor : unriddenColor);

    const upperColor = prevRidden === null ? "transparent" : (prevRidden ? riddenColor : unriddenColor);
    const lowerColor = nextRidden === null ? "transparent" : (nextRidden ? riddenColor : unriddenColor);

    const shaded = i % 2 === 1 ? " shaded" : "";
    html += `
      <div class="rt-row${shaded}">
        <div class="rt-name">${name}</div>
        <div class="rt-dot-wrap">
          <div class="rt-line-half" style="background:${upperColor};"></div>
          <span class="rt-dot" style="${dotRidden ? `background:${riddenColor};border-color:${riddenColor};` : `border-color:${unriddenColor};`}"></span>
          <div class="rt-line-half" style="background:${lowerColor};"></div>
        </div>
      </div>
    `;

    if (belowVias.length) html += renderViaRow(belowVias, nextRidden ? riddenColor : unriddenColor);
  });

  if (isLoop) {
    const lastSegRidden = riddenSegments.has(totalSegments - 1);
    html += `
      <div class="rt-row">
        <div class="rt-name">${stationsOnRoute[0]}（一周）</div>
        <div class="rt-dot-wrap">
          <div class="rt-line-half" style="background:${lastSegRidden ? riddenColor : unriddenColor};"></div>
          <span class="rt-dot" style="${lastSegRidden ? `background:${riddenColor};border-color:${riddenColor};` : `border-color:${unriddenColor};`}"></span>
          <div class="rt-line-half" style="background:transparent;"></div>
        </div>
      </div>
    `;
  }

  html += '</div>';
  box.innerHTML = html;

  box.querySelectorAll(".via-pill").forEach(btn => {
    btn.onclick = () => jumpToRoute(btn.dataset.route);
  });
}
</script>

</body>
</html>
