<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ダイヤJSONジェネレーター v1.14.0</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1b1f24;--sub:#667;--bd:#d5d9df;--ac:#1f6feb;--ng:#c62828;--ok:#2e7d32;--wn:#b26a00}
@media (prefers-color-scheme:dark){:root{--bg:#14171b;--card:#1d2127;--tx:#e6e8eb;--sub:#9aa3ad;--bd:#343b44;--ac:#5b9dff;--ng:#ff6b6b;--ok:#6fcf7a;--wn:#f0b050}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 system-ui,sans-serif;padding:0}.wrap{padding:12px 16px 80px}
h1{font-size:18px;margin:4px 0 12px}h2{font-size:15px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--sub);margin:6px 0 2px}
input,select,button,textarea{font:inherit;color:inherit;background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:6px 8px;max-width:100%}
input[type=checkbox]{padding:0}
button{background:var(--ac);color:#fff;border:0;padding:8px 14px;cursor:pointer}button.sub{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button:disabled{opacity:.5}
.search-results{background:var(--card);border:1px solid var(--bd);border-radius:10px;margin-top:4px;overflow:hidden;max-height:200px;overflow-y:auto}.search-results button{display:block;width:100%;text-align:left;background:transparent;color:var(--tx);border:0;border-radius:0;padding:7px 10px}.search-results button:hover{background:var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}.row>div{flex:1 1 150px}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{border-bottom:1px solid var(--bd);padding:4px;text-align:left;vertical-align:top}
td input{width:100%;min-width:60px}.brk td{background:#f6f8fb;font-size:12px}.brk table{width:auto}.brk .sp{color:#145}.bt{white-space:nowrap}.cmpwrap{display:flex;gap:10px;flex-wrap:wrap}.cmpwrap>div{flex:1;min-width:300px}.cmpbox{max-height:260px;overflow:auto}.scroll{overflow-x:auto}
.ok{color:var(--ok)}.ng{color:var(--ng)}.wn{color:var(--wn)}.mut{color:var(--sub);font-size:12px}
#log{white-space:pre-wrap;font:12px/1.4 ui-monospace,monospace;max-height:200px;overflow:auto;background:var(--bg);border-radius:6px;padding:6px}
progress{width:100%}
</style>
</head>
<body>
<div class="wrap" id="app">
<h1>ダイヤJSONジェネレーター <span class="mut" id="verH">v1.14.0</span> <a href="dia_admin.html" class="mut" style="font-size:12px">→ ダイヤ管理ページ</a></h1>

<div class="card" id="c1">
  <h2>1. 接続</h2>
  <div class="row">
    <div><label>合言葉(初回だけ入力。このブラウザに保存されます)</label><input id="key" type="password" autocomplete="off" style="width:100%"></div>
    <div><button id="btnConn">接続テスト</button></div>
  </div>
  <div id="connMsg" class="mut"></div>
</div>

<div class="card" id="c2">
  <h2>2. 路線と日付</h2>
  <div class="row">
    <div><label>エリア</label><select id="selArea"></select></div>
    <div><label>種別</label><select id="selKind"></select></div>
    <div><label>会社</label><select id="selComp"></select></div>
    <div><label>路線</label><select id="selRosen"></select></div>
    <div><label>日付</label><input type="date" id="date"></div>
  </div>
  <div class="mut" id="rosenInfo"></div>
  <div class="row" style="margin-top:8px">
    <button id="btnList">ダイヤ一覧を取得</button>
    <button class="sub" id="btnImport">補足ファイルを読み込む</button>
    <button class="sub" id="btnExport">補足ファイルを書き出す</button>
    <input type="file" id="fileSup" accept=".json" hidden>
  </div>
</div>

<div class="card" id="c3" hidden>
  <h2>3. 補足情報 <span class="mut" id="patName"></span></h2>
  <div class="row">
    <div><label>曜日区分</label><input id="dWeekday"></div>
    <div><label>臨時(TRUE/FALSE)</label><input id="dRinji"></div>
    <div><label>適用開始日</label><input id="dStart"></div>
    <div><label>臨時ダイヤ名(臨時ダイヤの時だけ)</label><input id="dPat"></div>
  </div>
  <h2 style="margin-top:10px">所定ごとの設定</h2>
  <div class="scroll"><table id="tblGroups"></table></div>
  <h2 style="margin-top:10px">ダイヤ(<span id="nDia"></span>件)</h2>
  <div class="row" style="margin-bottom:4px"><button class="sub" id="btnClearCars" type="button">個別両数を全部クリア</button><span class="mut" id="clearMsg"></span></div>
  <div class="scroll"><table id="tblDia"></table></div>
  <div class="row" style="margin-top:8px"><button id="btnConv">時刻を取得して変換</button><button class="sub" id="btnStop" disabled>中止</button></div>
  <div id="convMsg" class="ng"></div>
  <progress id="prog" value="0" max="1" hidden></progress>
</div>

<div class="card" id="c4" hidden>
  <h2>4. プレビュー</h2>
  <div id="unkBox"></div>
  <div class="scroll"><table id="tblPrev"></table></div>
</div>

<div class="card" id="c5" hidden>
  <h2>5. 保存</h2>
  <div class="row"><button id="btnDry">保存せず確認(dry run)</button><button id="btnSave" disabled>保存する</button><button id="btnSaveExport" class="sub">書き出す</button></div>
  <div id="saveRes"></div>
</div>

<div class="card"><h2>ログ</h2><div id="log"></div></div>

</div>
<div id="gate" hidden style="padding:40px 16px;text-align:center">このページは運営アカウント専用です。</div>
<script src="nav.js"></script>
<script>initNav("JSONジェネレーター");if(localStorage.getItem("username")!=="運営"){document.getElementById("app").hidden=true;document.getElementById("gate").hidden=false;}</script>
<script src="generator_core.js?v=1.5.0"></script>
<script>
"use strict";
const VER="1.14.0";document.title="ダイヤJSONジェネレーター v"+VER;document.addEventListener("DOMContentLoaded",()=>{const h=document.getElementById("verH");if(h)h.textContent="v"+VER;});
const MASTER_SHEET="1ZooIjdlOwsLZVjQv6KN53h4X2JYUyULYuJTuhbgk95s";
const ICON_BASE="https://img.elesite-next.com";
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const log=m=>{const l=$("log");l.textContent+=`[${new Date().toLocaleTimeString()}] ${m}\n`;l.scrollTop=l.scrollHeight;};
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}};
const ssGet=k=>{try{return sessionStorage.getItem(k)}catch(e){return null}};
const ssSet=(k,v)=>{try{sessionStorage.setItem(k,v)}catch(e){}};
// 合言葉は初回だけ入力。ブラウザ（localStorage）に覚えておく（ダイヤ管理ページと共通）
const keyLoad=()=>{try{return localStorage.getItem("gen_key")||""}catch(e){}return ssGet("gen_key")||""};
const keySave=v=>{ssSet("gen_key",v);try{localStorage.setItem("gen_key",v)}catch(e){}};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const jstDate=()=>new Date(Date.now()+9*3600e3).toISOString().slice(0,10);

/* ---------- 状態 ---------- */
const S={rosenTree:null,rosen:null,sup:null,results:[],manifest:null,stopFlag:false,master:null,lastPlan:null,fixes:{},autoUb:new Map(),autoBase:new Map()};

/* ---------- IndexedDB キャッシュ(時刻・流れ) ---------- */
let _db=null;
function idb(){return _db||(_db=new Promise((res,rej)=>{try{const q=indexedDB.open("tuts4_gen",1);q.onupgradeneeded=()=>q.result.createObjectStore("c");q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);}catch(e){rej(e)}}));}
async function cget(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction("c").objectStore("c").get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(undefined);});}catch(e){return undefined}}
async function cset(k,v){try{const d=await idb();d.transaction("c","readwrite").objectStore("c").put(v,k);}catch(e){}}

/* ---------- Worker API ---------- */
const WORKER_URL="https://tuts4-gen.osakasubwaymetro.workers.dev";
const baseUrl=()=>WORKER_URL;
const keyVal=()=>$("key").value;
async function api(path,{method="GET",body=null,auth=true}={}){
  const h={}; if(auth)h["X-Tuts4-Key"]=keyVal(); if(body)h["Content-Type"]="application/json";
  let r; try{r=await fetch(baseUrl()+path,{method,headers:h,body:body?JSON.stringify(body):undefined});}
  catch(e){throw {code:"network",message:"Workerに繋がりません: "+e.message};}
  let j=null; try{j=await r.json();}catch(e){}
  if(!r.ok||(j&&j.ok===false)){const er=(j&&j.error)||{};throw {status:r.status,code:er.code||("http"+r.status),message:er.message||("HTTP "+r.status),details:er.details};}
  return j;
}
const ele=(ep,body)=>api("/api/ele/"+ep,{method:"POST",body});
async function eleRetry(ep,body,n=3){let last;for(let i=0;i<n;i++){try{return await ele(ep,body);}catch(e){last=e;if(e.code==="unauthorized"||e.status===400)throw e;await sleep(1500*(i+1));}}throw last;}

/* ---------- 1. 接続 ---------- */
$("key").value=keyLoad();
$("key").addEventListener("keydown",e=>{if(e.key==="Enter")$("btnConn").click();});
$("btnConn").onclick=async()=>{
  keySave(keyVal());
  try{const m=await api("/api/manifest");S.manifest=m;$("connMsg").innerHTML=`<span class="ok">接続OK</span> 路線ファイル ${m.files.length} 件 / generated ${esc(m.generated)}`;log("接続OK");}
  catch(e){$("connMsg").innerHTML=`<span class="ng">${esc(e.message)}</span>`;log("接続NG: "+e.message);}
};
if($("key").value)setTimeout(()=>$("btnConn").click(),0); // 覚えた合言葉があれば自動で接続

/* ---------- 2. 路線選択 ---------- */
function fill(sel,arr){sel.innerHTML=arr.map(a=>`<option>${esc(a)}</option>`).join("");}
async function loadRosen(){
  const r=await fetch("rosen_list.json");S.rosenTree=await r.json();
  fill($("selArea"),Object.keys(S.rosenTree));onArea();
}
function onArea(){const t=S.rosenTree[$("selArea").value]||{};fill($("selKind"),Object.keys(t));onKind();}
function onKind(){const t=(S.rosenTree[$("selArea").value]||{})[$("selKind").value]||{};fill($("selComp"),Object.keys(t));onComp();}
function onComp(){const l=(((S.rosenTree[$("selArea").value]||{})[$("selKind").value]||{})[$("selComp").value])||[];
  $("selRosen").innerHTML=l.map((x,i)=>`<option value="${i}">${esc(x.rosen_name)}</option>`).join("");onRosen();}
function onRosen(){const l=(((S.rosenTree[$("selArea").value]||{})[$("selKind").value]||{})[$("selComp").value])||[];
  S.rosen=l[+$("selRosen").value]||null;
  $("rosenInfo").textContent=S.rosen?`rosen_code=${S.rosen.rosen_code} / route_id=${S.rosen.route_id}`+(S.rosen.concat_route_ids?` / 連結 ${S.rosen.concat_route_ids.join(",")}`:""):"";}
$("selArea").onchange=onArea;$("selKind").onchange=onKind;$("selComp").onchange=onComp;$("selRosen").onchange=onRosen;
$("date").value=lsGet("gen_date")||jstDate();

/* ---------- 補足情報(make_supplement.py の移植) ---------- */
function deriveDefaults(name,date){
  let start="",base=name||"";const m=/#(\d{4})(\d{2})(\d{2})\s*$/.exec(base);
  if(m){start=`${m[1]}-${m[2]}-${m[3]}`;base=base.slice(0,m.index);}
  let weekday,rinji;
  if(base.includes("平日")){weekday="平日";rinji="FALSE";}
  else if(base.includes("休日")||base.includes("土休")){weekday="土休日";rinji="FALSE";}
  else{weekday=date;rinji="TRUE";}
  return {weekday,rinji,start_date:start};
}
const pyQuote=p=>encodeURIComponent(p).replace(/%2F/g,"/").replace(/[!'()*]/g,c=>"%"+c.charCodeAt(0).toString(16).toUpperCase());
const iconUrls=l=>(l||[]).map(p=>ICON_BASE+pyQuote(p)).join("\n");

$("btnList").onclick=async()=>{
  if(!S.rosen){alert("路線を選んでください");return;}
  const date=$("date").value;lsSet("gen_date",date);
  $("btnList").disabled=true;
  try{
    const rc=S.rosen.rosen_code,rid=S.rosen.route_id;
    log(`パターン取得: ${rc} ${date}`);
    const pat=await ele("get_today_dia_pattern",{rosen_code:rc,select_date:date});
    log(`パターン: ${pat.name} (day_id=${pat.day_id})`);
    const table=await ele("get_unyoutable",{rosen_code:rc,route_id:rid,day_id:pat.day_id,select_date:date});
    const groups=[],diagrams=[],seen=new Set();let autoN=0,emptyN=0,sampleKeys="";S.autoUb=new Map();S.autoBase=new Map();
    for(const b of (table.unyou_table||[])){
      const sh=b.shotei||"";
      if(!groups.some(g=>g.shotei===sh))groups.push({shotei:sh,prefix:"",company:"",cars:""});
      for(const g of (b.unyou_group||[])){
        if(seen.has(g.unyou_id))continue;seen.add(g.unyou_id);
        const d={unyou_id:g.unyou_id,unban:String(g.unban||""),shotei:sh,trains:(g.retsuban_list||[]).length,icons:iconUrls(g.icon_path_list)};
        if(!d.unban){ // ele に運番が無い: 始発駅＋始発時刻(HHMM)が一覧から確実に取れる時だけここで入れる（取れない時は変換時に時刻表から補う）
          const ub=GenCore.unbanFromGroup(g);
          if(ub){d.unban=ub;S.autoUb.set(d.unyou_id,ub);S.autoBase.set(d.unyou_id,ub);autoN++;}
          else{emptyN++;if(!sampleKeys)sampleKeys=Object.keys(g).join(",");}
        }
        if(g.formation!=null&&g.formation!==""&&!(Array.isArray(g.formation)&&!g.formation.length))d.cars=Array.isArray(g.formation)?g.formation.join(", "):String(g.formation);
        diagrams.push(d);
      }
    }
    setSup({rosen_code:rc,route_id:rid,date,day_id:pat.day_id,pattern:pat.name||"",defaults:deriveDefaults(pat.name,date),groups,diagrams});
    log(`ダイヤ ${diagrams.length} 件 / 所定 ${groups.length} 件`);
    if(autoN)log(`運番が空だった ${autoN} 件に、一覧の始発駅・始発時刻から自動で入れました(入力欄で直せます)`);
    if(emptyN)log(`運番が空のダイヤ ${emptyN} 件: 一覧から始発が取れなかったため、変換時に時刻表の先頭列車(始発駅＋始発時刻)から自動で入れます(一覧の項目: ${sampleKeys})`);
  }catch(e){log("一覧取得失敗: "+e.message);alert(e.message);}
  $("btnList").disabled=false;
};

function setSup(sup){
  S.sup=sup;S.results=[];$("c4").hidden=true;$("c5").hidden=true;
  $("c3").hidden=false;$("patName").textContent=sup.pattern?`(${sup.pattern})`:"";
  const d=sup.defaults||{};$("dWeekday").value=d.weekday||"";$("dRinji").value=d.rinji||"";$("dStart").value=d.start_date||"";$("dPat").value=d.pattern_name||"";
  $("tblGroups").innerHTML=`<tr><th>所定</th><th>ID接頭辞</th><th>会社</th><th>両数</th></tr>`+sup.groups.map((g,i)=>
    `<tr><td>${esc(g.shotei)}</td><td><input data-g="${i}" data-f="prefix" value="${esc(g.prefix)}"></td><td><input data-g="${i}" data-f="company" autocomplete="off" value="${esc(g.company)}"></td><td><input data-g="${i}" data-f="cars" value="${esc(g.cars)}"></td></tr>`).join("");
  $("nDia").textContent=sup.diagrams.length;
  $("tblDia").innerHTML=`<tr><th><input type="checkbox" id="chkAll" checked></th><th>運用ID</th><th>運番</th><th>所定</th><th>列車数</th><th>個別 接頭辞</th><th>個別 両数</th></tr>`+sup.diagrams.map((x,i)=>
    `<tr><td><input type="checkbox" class="chk" data-i="${i}" ${x.skip?"":"checked"}></td><td>${esc(x.unyou_id)}</td><td><input data-d="${i}" data-f="unban" value="${esc(x.unban)}" style="width:50px"></td><td>${esc(x.shotei)}</td><td>${esc(x.trains)}</td><td><input data-d="${i}" data-f="prefix" value="${esc(x.prefix||"")}"></td><td><input data-d="${i}" data-f="cars" value="${esc(x.cars||"")}"></td></tr>`).join("");
  $("chkAll").onchange=e=>document.querySelectorAll(".chk").forEach(c=>c.checked=e.target.checked);
}
$("btnClearCars").onclick=()=>{
  let n=0;document.querySelectorAll('[data-d][data-f="cars"]').forEach(i=>{if(i.value!==""){n++;i.value="";}});
  $("clearMsg").textContent=n?`${n}件の個別両数をクリアしました`:"クリアする個別両数はありません";
};

/* ---------- 会社名の候補(1.7.0) ---------- */
/* 会社名の主ソース(1.9.0): マスタスプレッドシート route タブの「会社」列(空は除外・重複はまとめる)。
   localStorage(gen_master_comps)に控え、開いたら最新を取りに行く。取れない時は控え→従来の候補(manifest・読み込み中データ)。 */
S.masterComps=[];
const uniqComps=a=>[...new Set((a||[]).map(c=>String(c==null?"":c).trim()).filter(Boolean))];
(async()=>{
  try{S.masterComps=uniqComps(JSON.parse(lsGet("gen_master_comps")||"[]"));}catch(e){}
  try{
    const r=await fetch(`https://opensheet.elk.sh/${MASTER_SHEET}/route`,{cache:"no-store"});const j=await r.json();
    if(Array.isArray(j)){const c=uniqComps(j.map(x=>x["会社"]));if(c.length){S.masterComps=c;lsSet("gen_master_comps",JSON.stringify(c));}}
  }catch(e){}
})();
function compList(skip){
  const set=new Set();
  if(S.masterComps&&S.masterComps.length)S.masterComps.forEach(c=>set.add(c));
  else{ // 従来の候補(マスタが取れず控えも無い時のフォールバック)
    try{JSON.parse(lsGet("gen_comps")||"[]").forEach(c=>c&&set.add(c));}catch(e){}
    if(S.manifest&&S.manifest.files)S.manifest.files.forEach(f=>{if(f.company)set.add(f.company);});
    if(S.sup&&S.sup.groups)S.sup.groups.forEach(g=>{if(g.company)set.add(g.company);});
  }
  document.querySelectorAll('[data-g][data-f="company"]').forEach(i=>{if(i!==skip&&i.value.trim())set.add(i.value.trim());});
  if(S.manifest&&S.manifest.files&&S.manifest.files.length)lsSet("gen_comps",JSON.stringify([...new Set(S.manifest.files.map(f=>f.company).filter(Boolean))]));
  return [...set];
}
function compBoxClose(){document.querySelectorAll(".compbox").forEach(b=>b.remove());}
function compSearch(inp){
  compBoxClose();
  const q=inp.value.trim().toLowerCase();
  const hit=compList(inp).filter(c=>!q||c.toLowerCase().includes(q));
  if(!hit.length||(hit.length===1&&hit[0].toLowerCase()===q))return;
  const d=document.createElement("div");d.className="compbox search-results";
  d.innerHTML=hit.map(c=>`<button type="button" data-c="${esc(c)}">${esc(c)}</button>`).join("");
  inp.parentNode.appendChild(d);
}
$("tblGroups").addEventListener("input",e=>{if(e.target.matches('[data-f="company"]'))compSearch(e.target);});
$("tblGroups").addEventListener("focusin",e=>{if(e.target.matches('[data-f="company"]'))compSearch(e.target);});
$("tblGroups").addEventListener("mousedown",e=>{
  const b=e.target.closest(".compbox button");if(!b)return;
  e.preventDefault();const inp=b.closest("td").querySelector('[data-f="company"]');inp.value=b.dataset.c;compBoxClose();
});
document.addEventListener("click",e=>{if(!e.target.closest("#tblGroups"))compBoxClose();});
function readSup(){
  const s=S.sup;
  s.defaults={weekday:$("dWeekday").value.trim(),rinji:$("dRinji").value.trim(),start_date:$("dStart").value.trim()};
  const pn=$("dPat").value.trim();if(pn)s.defaults.pattern_name=pn;
  document.querySelectorAll("[data-g]").forEach(i=>{s.groups[+i.dataset.g][i.dataset.f]=i.value.trim();});
  document.querySelectorAll("[data-d]").forEach(i=>{const d=s.diagrams[+i.dataset.d];const v=i.value.trim();if(i.dataset.f==="unban")d.unban=v;else if(v)d[i.dataset.f]=v;else delete d[i.dataset.f];});
  document.querySelectorAll(".chk").forEach(c=>{const d=s.diagrams[+c.dataset.i];if(c.checked)delete d.skip;else d.skip=true;});
  return s;
}
$("btnExport").onclick=()=>{
  if(!S.sup){alert("先にダイヤ一覧を取得してください");return;}
  const s=readSup();const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,1)],{type:"application/json"}));
  a.download=`supplement_${s.rosen_code}_${s.date}.json`;a.click();
};
$("btnImport").onclick=()=>$("fileSup").click();
$("fileSup").onchange=async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const s=JSON.parse(await f.text());if(!s.diagrams||!s.rosen_code)throw new Error("補足ファイルの形式が違います");

async function loadMaster(){

/* 列車内訳(1.12.0): 読み取り専用。判定は GenCore.attributeRoutes と同じ結果(explainRoutes が内部で呼ぶ) */
S.brk=new Set();S.cmp=new Set();S.dups=new Map();S.dupAct={};S.fileCache=new Map();S.scanId=0;
/* 同内容ダイヤの警告(1.14.0): キー(ID_運番)は違うが時刻表が全く同じダイヤを、保存先の既存ファイルと一覧の中から探す。エラーではなく警告。保存はブロックしない */
const routeList=r=>String(r.routes).split(",").map(x=>x.trim()).filter(Boolean);
function mergedByKey(){ // buildPlan と同じ統合: 同じキーは行を連結
  const m=new Map();
  S.results.forEach((r,i)=>{const k=`${r.eff.prefix}_${r.d.unban}`;const rows=GenCore.toOutputRows(r.conv.rows).slice(1);
    if(!m.has(k))m.set(k,{k,first:r,idx:i,rows:rows.slice()});else m.get(k).rows=m.get(k).rows.concat(rows);});
  return m;
}
async function scanDup(){
  const my=++S.scanId;
  if(!S.manifest||!S.manifest.files||!S.results.length)return;
  const by=mergedByKey();
  const need=new Map();
  for(const g of by.values())for(const rt of routeList(g.first))for(const f of S.manifest.files)if(f.company===g.first.eff.company&&f.route===rt)need.set(f.file,f);
  let failed=0;
  await Promise.all([...need.values()].map(async f=>{
    if(S.fileCache.has(f.file))return;
    try{const d=await api("/api/"+f.file);const sig=new Map();for(const [k,rows] of Object.entries(d.sheets||{}))sig.set(k,GenCore.sheetSig(rows));S.fileCache.set(f.file,{f,d,sig});}
    catch(e){failed++;log(`同内容ダイヤの確認: ${f.company} / ${f.route}(${f.file})を読めませんでした: ${e.message}`);}
  }));
  if(my!==S.scanId)return; // 後から走った確認を優先
  const dups=new Map(),seenSig=new Map();
  for(const g of by.values()){
    const sig=GenCore.sheetSig(g.rows);const hit={saved:[],list:[]};
    if(sig){
      const seen=new Set();
      for(const rt of routeList(g.first))for(const f of S.manifest.files){
        if(f.company!==g.first.eff.company||f.route!==rt)continue;
        const c=S.fileCache.get(f.file);if(!c)continue;
        for(const [sk,sg] of c.sig){
          if(sk===g.k||sg!==sig||seen.has(sk))continue; // 同じキーは従来の重複扱い
          seen.add(sk);
          const lr=(c.d.list||[]).find(x=>`${x["ID"]||""}_${x["運番"]||""}`===sk)||{};
          hit.saved.push({key:sk,id:String(lr["ID"]!=null?lr["ID"]:sk.split("_")[0]),unban:String(lr["運番"]!=null?lr["運番"]:sk.slice(sk.indexOf("_")+1)),company:f.company,route:f.route,file:f.file,rows:c.d.sheets[sk]});
        }
      }
      // 一覧の中: 先に出てきた別キーだけを相手にする(両方スキップしてしまわないように後の方にだけ警告)
      for(const e of seenSig.get(sig)||[])if(e.k!==g.k)hit.list.push({key:e.k,rows:e.rows});
      if(!seenSig.has(sig))seenSig.set(sig,[]);seenSig.get(sig).push({k:g.k,rows:g.rows});
    }
    if(hit.saved.length||hit.list.length){hit.rows=g.rows;dups.set(g.k,hit);}
  }
  S.dups=dups;
  for(const k of Object.keys(S.dupAct))if(!dups.has(k))delete S.dupAct[k];
  for(const [k,h] of dups)if(S.dupAct[k]==="over"&&!h.saved.length)delete S.dupAct[k];
  if(dups.size)log(`警告: 時刻表が全く同じ別キーのダイヤが ${dups.size} 件あります(変換リストの警告から見比べ・扱いを選べます)`);
  if(failed)log(`同内容の確認で読めなかった路線ファイルが ${failed} 件あります(その分は比べていません)`);
  refreshPrev();
}

    if(!r.routes)throw new Error(`${r.eff.prefix}_${r.d.unban}: 路線が空です`);
    const k=`${r.eff.prefix}_${r.d.unban}`;
    if(!byKey.has(k)){byKey.set(k,{k,first:r,rows:GenCore.toOutputRows(r.conv.rows).slice(1),srcs:[r]});order.push(k);}
    else{const g=byKey.get(k);g.rows=g.rows.concat(GenCore.toOutputRows(r.conv.rows).slice(1));g.srcs.push(r);}
  }
  const items=[];
  for(const k of order){
    const g=byKey.get(k),r=g.first;
    const act=S.dups.has(k)?(S.dupAct[k]||"add"):"add";
    if(act==="skip"){log(`${k} は時刻表が同じ別キーのダイヤがあるためスキップします`);continue;}
    if(g.srcs.length>1){
      const nm=g.srcs.map(x=>`運用ID ${x.d.unyou_id}`).join(" + ");
      log(`${k} に統合しました(${nm} → ${g.rows.length}行)`);
      const rs=s=>String(s).split(",").map(x=>x.trim()).filter(Boolean).sort().join(",");
      const diff=g.srcs.slice(1).filter(x=>rs(x.routes)!==rs(r.routes));
      if(diff.length)log(`警告: ${k} の統合で路線が食い違っています。先頭(運用ID ${r.d.unyou_id}: ${r.routes})を採用しました(食い違い: ${diff.map(x=>`運用ID ${x.d.unyou_id}: ${x.routes}`).join(" / ")})`);
    }
    let eff=r.eff,unb=r.d.unban;
    if(act==="over"&&S.dups.get(k).saved.length){const t=S.dups.get(k).saved[0];eff=Object.assign({},r.eff,{prefix:t.id});unb=t.unban;log(`${k} を保存済みの ${t.key} に上書きします(同じ時刻表。登録行は今回の内容)`);}
    items.push({obj:GenCore.buildRegistryRow(eff,r.routes,unb,last),rows:g.rows});
  }
  if(!items.length)throw new Error("保存するダイヤがありません(すべてスキップが選ばれています)");
  return GenCore.groupByRoute(items);
}
async function doSave(dry,modes){
  const groups=buildPlan();
  const m=await api("/api/manifest");S.manifest=m;
  return api("/api/save",{method:"POST",body:{source:"generator",dry_run:dry,base_generated:m.generated,modes:Object.assign({},planModes(),modes||{}),groups}});
}
function showRes(res,dry){
  const rows=(res.results||[]).map(x=>`<tr><td>${esc(x.company)} / ${esc(x.route)}</td><td>${esc(x.file)}</td><td class="ok">追加 ${(x.added||[]).length}</td><td>${(x.skipped||[]).length?`<span class="wn">既存あり ${esc((x.skipped||[]).join(", "))}</span>`:""}${(x.replaced||[]).length?` <span class="wn">上書き ${esc(x.replaced.join(", "))}</span>`:""}</td></tr>`).join("");
  S.lastPlan=res;
  const sk=(res.results||[]).flatMap(x=>x.skipped||[]);
  $("saveRes").innerHTML=`<div class="${dry?"mut":"ok"}">${dry?"確認のみ(まだ保存していません)":"保存しました generated "+esc(res.generated)}</div><div class="scroll"><table>${rows}</table></div>`+
    (sk.length?`<div style="margin-top:8px"><label><input type="checkbox" id="chkRep"> 既存のキーを今回の内容で上書きする(${sk.length}件)</label><div class="mut">スプシ由来のキーはWorkerが拒否します。上書き前の内容は履歴に残ります。</div></div>`:"");
  $("btnSave").disabled=!dry;
}
// 「保存する」が送るのと同じ本文をJSONファイルに書き出す（Workerに繋がらなくても必ず書き出せる）
$("btnSaveExport").onclick=async()=>{
  let groups;
  try{if(!S.results.length)throw new Error("書き出す変換結果がありません(先に変換してください)");groups=buildPlan();}
  catch(e){$("saveRes").innerHTML=`<pre class="ng">${esc(errTxt(e))}</pre>`;log("書き出しNG: "+e.message);return;}
  const rep=$("chkRep")&&$("chkRep").checked;const modes=Object.assign({},planModes());
  if(rep&&S.lastPlan)for(const x of (S.lastPlan.results||[]))for(const k of (x.skipped||[]))modes[k]="replace";
  let base="";
  if(S.manifest&&S.manifest.generated)base=S.manifest.generated;
  else{try{const m=await Promise.race([api("/api/manifest"),new Promise((_,rj)=>setTimeout(()=>rj(new Error("timeout")),4000))]);S.manifest=m;base=m.generated||"";}catch(e){base="";}}
  try{
    const body={source:"generator",dry_run:false,base_generated:base,modes,groups};
    const d=new Date(),z=n=>String(n).padStart(2,"0");
    const name=`tuts4-save-${d.getFullYear()}${z(d.getMonth()+1)}${z(d.getDate())}-${z(d.getHours())}${z(d.getMinutes())}${z(d.getSeconds())}.json`;
    const url=URL.createObjectURL(new Blob([JSON.stringify(body,null,2)],{type:"application/json"}));
    const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),10000);
    $("saveRes").innerHTML=`<div class="ok">書き出しました: ${esc(name)}</div><div class="mut">このファイルを Muse に渡せば手動で適用できます。${base?"":"(base_generated は空です。適用時に付け直します)"}${Object.keys(modes).length?` 上書き指定 ${Object.keys(modes).length} 件を含みます。`:""}</div>`;
    log(`書き出し完了 ${name}`);
  }catch(e){$("saveRes").innerHTML=`<pre class="ng">${esc(errTxt(e))}</pre>`;log("書き出しNG: "+e.message);}
};
function errTxt(e){return `${e.message}${e.details?"\n"+JSON.stringify(e.details).slice(0,400):""}`;}
$("btnDry").onclick=async()=>{
  try{const r=await doSave(true);showRes(r,true);log("dry run OK");}
  catch(e){$("saveRes").innerHTML=`<pre class="ng">${esc(errTxt(e))}</pre>`;log("dry run NG: "+e.message);}
};
$("btnSave").onclick=async()=>{
  const rep=$("chkRep")&&$("chkRep").checked;const modes={};
  if(rep)for(const x of (S.lastPlan.results||[]))for(const k of (x.skipped||[]))modes[k]="replace";
  if(rep&&!confirm(`${Object.keys(modes).length} 件の既存データを上書きします。よろしいですか?`))return;
  const pm=Object.keys(planModes());
  if(pm.length&&!confirm(`同じ時刻表の保存済みダイヤ ${pm.length} 件(${pm.join(", ")})を今回の登録内容で上書きします。よろしいですか?`))return;
  $("btnSave").disabled=true;
  try{const r=await doSave(false,modes);showRes(r,false);$("btnSave").disabled=true;S.fileCache=new Map();log("保存OK");}
  catch(e){
    if(e.code==="manifest_changed"){$("saveRes").innerHTML=`<div class="wn">他の更新と重なりました。もう一度「保存せず確認」から進めてください。</div>`;}
    else $("saveRes").innerHTML=`<pre class="ng">${esc(errTxt(e))}</pre>`;
    $("btnSave").disabled=false;log("保存NG: "+e.message);
  }
};

loadRosen().catch(e=>log("rosen_list.json を読めません: "+e.message));
</script>
